<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
<title id="title">The resource efficiency score averages a magnitude score and a percentile score</title>
<desc id="desc">Eight illustrative supported models with equal reference weight on three aligned 0 to 100 rulers. Top, the magnitude score keeps the spacing of their residuals between the limits: the most efficient model sits at L and scores 100, while one wasteful model has the largest residual, U, and scores 0, which crowds the other seven between about 72 and 100. Bottom, the percentile score ranks the same models evenly, from 12.5 for the wasteful model to 100. In the middle, each model's mean of the two scores lies halfway along the dotted line joining its magnitude and percentile scores, so it keeps both the size of each advantage and the spread of the ranks.</desc>
<style>
