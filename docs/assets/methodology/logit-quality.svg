<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" role="img" aria-labelledby="title desc">
<title id="title">An equal success-rate gain expands near the ceiling</title>
<desc id="desc">The logit curve gives a gain from 95 to 96 percent a log-odds distance of 0.234, compared with 0.040 for 50 to 51 percent. The lower bars share one scale and expose that difference.</desc>
