<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 75 760 175" role="img" aria-labelledby="title desc">
<title id="title">weightedQuantileRank(): value → percentile</title>
<desc id="desc">Ten equally weighted peer means: three below 70 count fully, three equal to 70 count half, and four above 70 do not count. The rank is 4.5 out of 10, or 45%.</desc>
<style>
text { font-family:"Avenir Next","Segoe UI",Arial,sans-serif; fill:#182421; }
.muted { fill:#63706e; } .blue { color:#146cba; } .teal { color:#087f6b; } .orange { color:#a64d0c; } .neutral { color:#63706e; } .ink { fill:currentColor; }
@media (prefers-color-scheme:dark) {
text { fill:#ffffff; } .muted { fill:#a6b2ae; } .neutral { color:#a6b2ae; }
.blue { color:#85bfff; } .teal { color:#62d6b1; } .orange { color:#ffbc7d; }
}
</style>


<text x="156" y="95" text-anchor="middle" font-size="15" class="teal ink">Below 70</text>
<text x="348" y="95" text-anchor="middle" font-size="15" class="orange ink">Equal to 70</text>
<text x="572" y="95" text-anchor="middle" font-size="15" class="muted">Above 70</text>
<g class="teal"><rect x="60" y="108" width="62" height="44" rx="3" fill="currentColor" opacity=".16"/><text x="91" y="137" text-anchor="middle" font-size="19">30</text><text x="91" y="184" text-anchor="middle" font-size="18" class="ink">1</text></g>
<g class="teal"><rect x="124" y="108" width="62" height="44" rx="3" fill="currentColor" opacity=".16"/><text x="155" y="137" text-anchor="middle" font-size="19">50</text><text x="155" y="184" text-anchor="middle" font-size="18" class="ink">1</text></g>
<g class="teal"><rect x="188" y="108" width="62" height="44" rx="3" fill="currentColor" opacity=".16"/><text x="219" y="137" text-anchor="middle" font-size="19">50</text><text x="219" y="184" text-anchor="middle" font-size="18" class="ink">1</text></g>
<g class="orange"><rect x="252" y="108" width="62" height="44" rx="3" fill="currentColor" opacity=".16"/><text x="283" y="137" text-anchor="middle" font-size="19">70</text><text x="283" y="184" text-anchor="middle" font-size="18" class="ink">½</text></g>
<g class="orange"><rect x="316" y="108" width="62" height="44" rx="3" fill="currentColor" opacity=".16"/><text x="347" y="137" text-anchor="middle" font-size="19">70</text><text x="347" y="184" text-anchor="middle" font-size="18" class="ink">½</text></g>
<g class="orange"><rect x="380" y="108" width="62" height="44" rx="3" fill="currentColor" opacity=".16"/><text x="411" y="137" text-anchor="middle" font-size="19">70</text><text x="411" y="184" text-anchor="middle" font-size="18" class="ink">½</text></g>
<g class="neutral"><rect x="444" y="108" width="62" height="44" rx="3" fill="currentColor" opacity=".16"/><text x="475" y="137" text-anchor="middle" font-size="19">90</text><text x="475" y="184" text-anchor="middle" font-size="18" class="ink">0</text></g>
<g class="neutral"><rect x="508" y="108" width="62" height="44" rx="3" fill="currentColor" opacity=".16"/><text x="539" y="137" text-anchor="middle" font-size="19">90</text><text x="539" y="184" text-anchor="middle" font-size="18" class="ink">0</text></g>
<g class="neutral"><rect x="572" y="108" width="62" height="44" rx="3" fill="currentColor" opacity=".16"/><text x="603" y="137" text-anchor="middle" font-size="19">90</text><text x="603" y="184" text-anchor="middle" font-size="18" class="ink">0</text></g>
<g class="neutral"><rect x="636" y="108" width="62" height="44" rx="3" fill="currentColor" opacity=".16"/><text x="667" y="137" text-anchor="middle" font-size="19">90</text><text x="667" y="184" text-anchor="middle" font-size="18" class="ink">0</text></g>

<text x="40" y="241" font-size="20" font-weight="600" class="orange ink">weightedQuantileRank(70) = 45% → r = 0.45</text>
</svg>
