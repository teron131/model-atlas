<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-labelledby="title desc">
<title id="title">Freeze the current reference, then extend across generations</title>
<desc id="desc">A schematic plot shows release generations horizontally and a fixed capability scale vertically. Solid points in the initial snapshot have at least sixty percent evidence support and establish the reference. Three points at fifty percent opacity have lower coverage and do not define the saved range, including points above and below it. Retained evidence connects older models on the left, and new evidence connects future models on the right, using the same fixed ruler.</desc>
