<text class="muted" x="80" y="40">Normalized score</text>
<path class="grid" d="M80 250L249 250M297 250L369 250M417 250L420 250"/><text class="num muted" x="66" y="254.5" text-anchor="end">50</text><path class="grid" d="M80 210L369 210M417 210L420 210"/><text class="num muted" x="66" y="214.5" text-anchor="end">60</text><path class="grid" d="M80 170L129 170M177 170L420 170"/><text class="num muted" x="66" y="174.5" text-anchor="end">70</text><path class="grid" d="M80 130L129 130M177 130L249 130M297 130L420 130"/><text class="num muted" x="66" y="134.5" text-anchor="end">80</text>
<text class="small muted" x="120" y="66" text-anchor="middle">Benchmark A</text><path class="axis" d="M120 80L120 290"/><path class="ink-line" d="M106 130h-6V170h6" stroke-width="1.5"/><text class="num strong" x="94" y="155" text-anchor="end">+10</text><g><circle class="ink halo" cx="120" cy="130" r="8" filter="url(#glow)"/><circle class="ink ring" cx="120" cy="130" r="6"/></g><text class="num" x="132" y="135">A  80</text><g><circle class="ink halo" cx="120" cy="170" r="8" filter="url(#glow)"/><circle class="ink ring" cx="120" cy="170" r="6"/></g><text class="num" x="132" y="175">B  70</text><text class="small muted" x="120" y="318" text-anchor="middle">C: no result</text><text class="small muted" x="240" y="66" text-anchor="middle">Benchmark B</text><path class="axis" d="M240 80L240 290"/><path class="ink-line" d="M226 130h-6V250h6" stroke-width="1.5"/><text class="num strong" x="214" y="195" text-anchor="end">+30</text><g><circle class="ink halo" cx="240" cy="130" r="8" filter="url(#glow)"/><circle class="ink ring" cx="240" cy="130" r="6"/></g><text class="num" x="252" y="135">A  80</text><g><circle class="ink halo" cx="240" cy="250" r="8" filter="url(#glow)"/><circle class="ink ring" cx="240" cy="250" r="6"/></g><text class="num" x="252" y="255">C  50</text><text class="small muted" x="240" y="318" text-anchor="middle">B: no result</text><text class="small muted" x="360" y="66" text-anchor="middle">Benchmark C</text><path class="axis" d="M360 80L360 290"/><path class="ink-line" d="M346 210h-6V250h6" stroke-width="1.5"/><text class="num strong" x="334" y="235" text-anchor="end">+10</text><g><circle class="ink halo" cx="360" cy="210" r="8" filter="url(#glow)"/><circle class="ink ring" cx="360" cy="210" r="6"/></g><text class="num" x="372" y="215">B  60</text><g><circle class="ink halo" cx="360" cy="250" r="8" filter="url(#glow)"/><circle class="ink ring" cx="360" cy="250" r="6"/></g><text class="num" x="372" y="255">C  50</text><text class="small muted" x="360" y="318" text-anchor="middle">A: no result</text>
<path class="ink-line" d="M430 150L462 150" stroke-width="1.5" marker-end="url(#tip-ink)"/>
<text class="small muted" x="600" y="66" text-anchor="middle">One ordering</text><text class="small muted" x="534" y="100" text-anchor="middle">Observed</text><text class="small muted" x="666" y="100" text-anchor="middle">Fitted</text>
<path class="axis" d="M600 112L600 282"/>
<path class="ink-line" d="M564 136.7h-6V176.7h6" stroke-width="1.5"/><text class="num strong" x="552" y="161.7" text-anchor="end">+10</text><path class="ink-line" d="M564 190h-6V230h6" stroke-width="1.5"/><text class="num strong" x="552" y="215" text-anchor="end">+10</text><path class="ink-line" d="M504 136.7h-6V256.7h6" stroke-width="1.5"/><text class="num strong" x="492" y="201.7" text-anchor="end">+30</text><path class="violet-line" d="M636 136.7h6V190h-6" stroke-width="1.5"/><text class="num strong violet" x="648" y="168.3">+13.3</text><path class="violet-line" d="M636 190h6V243.3h-6" stroke-width="1.5"/><text class="num strong violet" x="648" y="221.7">+13.3</text><path class="violet-line" d="M696 136.7h6V243.3h-6" stroke-width="1.5"/><text class="num strong violet" x="708" y="195">+26.7</text><g><circle class="violet halo" cx="600" cy="136.7" r="9" filter="url(#glow)"/><circle class="violet ring" cx="600" cy="136.7" r="7"/></g><text class="strong" x="613" y="141.7">A</text><g><circle class="violet halo" cx="600" cy="190" r="9" filter="url(#glow)"/><circle class="violet ring" cx="600" cy="190" r="7"/></g><text class="strong" x="613" y="195">B</text><g><circle class="violet halo" cx="600" cy="243.3" r="9" filter="url(#glow)"/><circle class="violet ring" cx="600" cy="243.3" r="7"/></g><text class="strong" x="613" y="248.3">C</text>
</svg>
