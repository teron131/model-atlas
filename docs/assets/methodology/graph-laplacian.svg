<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Shared benchmarks connect models into one ordering</title>
<desc id="desc">Hypothetical normalized scores illustrate partially overlapping benchmark coverage. Model A reports Benchmark A 80 and Benchmark B 70; Model B reports Benchmark A 70 and Benchmark C 60; Model C reports Benchmark B 50 and Benchmark C 50. Models A and B compare on Benchmark A, models A and C on Benchmark B, and models B and C on Benchmark C. These gaps fit one ordering with Model A ten points above Model B and Model B ten above Model C. No benchmark is shared by all three. Missing results create no comparison.</desc>
<style>
text { font-family:"Avenir Next","Segoe UI",Arial,sans-serif; fill:#000000; }
.muted { fill:#63706e; } .blue { fill:#146cba; }
.panel { fill:#ffffff; stroke:#b5bfbc; }
@media (prefers-color-scheme:dark) {
text { fill:#ffffff; } .muted { fill:#a6b2ae; } .blue { fill:#85bfff; }
.panel { fill:#101719; stroke:#3c4846; }
[stroke="#b5bfbc"] { stroke:#3c4846; } [stroke="#63706e"] { stroke:#a6b2ae; }
[stroke="#146cba"] { stroke:#85bfff; } [fill="#146cba"] { fill:#85bfff; }
}
</style>
<text x="24" y="30" font-size="19" font-weight="600">Each pair compares only its common benchmarks</text>
<text x="24" y="54" font-size="13" class="muted">Hypothetical normalized scores · cards show reported benchmarks only</text>
<!-- Shared benchmark links terminate at the model cards. -->
<g fill="none" stroke="#146cba" stroke-width="2">
<path d="M118 167 L181 256"/>
<path d="M342 167 L281 256"/>
<path d="M198 123 H262"/>
</g>
<g font-size="14" class="blue" text-anchor="middle">
<text x="230" y="72">Benchmark A · A +10</text>
<text x="79" y="210">Benchmark B</text><text x="79" y="229">A +20</text>
<text x="377" y="210">Benchmark C</text><text x="377" y="229">B +10</text>
</g>
<g>
<rect class="panel" x="38" y="79" width="160" height="88" rx="12"/>
<rect class="panel" x="262" y="79" width="160" height="88" rx="12"/>
<rect class="panel" x="150" y="256" width="160" height="88" rx="12"/>
<g font-size="17" font-weight="600">
<text x="54" y="105">Model A</text><text x="278" y="105">Model B</text><text x="166" y="282">Model C</text>
</g>
<g font-size="13" class="muted">
<text x="54" y="130">Benchmark A</text><text x="54" y="151">Benchmark B</text>
<text x="278" y="130">Benchmark A</text><text x="278" y="151">Benchmark C</text>
<text x="166" y="307">Benchmark B</text><text x="166" y="328">Benchmark C</text>
</g>
<g font-size="14" text-anchor="end">
<text x="181" y="130">80</text><text x="181" y="151">70</text>
<text x="405" y="130">70</text><text x="405" y="151">60</text>
<text x="293" y="307">50</text><text x="293" y="328">50</text>
</g>
</g>
<path d="M435 220 H486 M478 212 L486 220 L478 228" fill="none" stroke="#63706e" stroke-width="2"/>
<text x="460" y="250" font-size="12" text-anchor="middle" class="muted">fit together</text>
<text x="523" y="90" font-size="18" font-weight="600">One ordering</text>
<text x="523" y="112" font-size="12" class="muted">Relative ratings before mapping</text>
<path d="M548 144 V324" stroke="#b5bfbc" stroke-width="3"/>
<g fill="#146cba">
<circle cx="548" cy="154" r="6"/><circle cx="548" cy="234" r="6"/><circle cx="548" cy="314" r="6"/>
</g>
<g font-size="16" font-weight="600">
<text x="569" y="160">Model A</text><text x="569" y="240">Model B</text><text x="569" y="320">Model C</text>
</g>
<g font-size="13" class="blue">
<text x="569" y="199">10 points apart</text><text x="569" y="279">10 points apart</text>
</g>
<path d="M24 367 H736" stroke="#b5bfbc"/>
<text x="24" y="391" font-size="14">Different pairs can share different benchmarks. The fit connects their comparisons.</text>
<text x="24" y="412" font-size="13" class="muted">No shared result → no direct comparison. Missing results are not counted as losses.</text>
</svg>
