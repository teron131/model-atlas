<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
<title id="title">Disagreeing comparisons fitted into one ordering</title>
<desc id="desc">Hypothetical normalized scores on three benchmark rulers. Benchmark A compares Model A at 80 with Model B at 70, a gap of 10; Benchmark B compares Model A at 80 with Model C at 50, a gap of 30; Benchmark C compares Model B at 60 with Model C at 50, a gap of 10. The first and third gaps imply an A to C gap of 20, which disagrees with the observed 30, so no ordering can match all three. On the fitted ordering, drawn at the same scale as the rulers, the observed gaps of 10, 10 and 30, hung from each pair's upper model, fall short twice and overshoot once. The fitted gaps of 13.3, 13.3 and 26.7 meet the points exactly: the equal-weight least-squares fit spreads the disagreement across all three comparisons.</desc>
<style>
