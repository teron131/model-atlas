<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" role="img" aria-labelledby="title desc">
<title id="title">Peer support narrows the bounded token adjustment</title>
<desc id="desc">With full peer support the multiplier runs from 1.15 for fewer tokens to 0.85 for more tokens, reaching its cap at minus or plus two spread units of log-token residual. Half support halves the adjustment to between 1.075 and 0.925. No support leaves the contribution unchanged at 1. The cap applies before rescaling.</desc>
