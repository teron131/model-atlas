<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" role="img" aria-labelledby="title desc">
<title id="title">Peer support narrows the bounded token adjustment</title>
<desc id="desc">Full support permits multipliers from 1.15 to 0.85, capped at residuals of minus or plus two robust spread units. Half support halves the adjustment. No support leaves the contribution unchanged. The cap precedes cohort remapping.</desc>
