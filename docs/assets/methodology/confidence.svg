<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Evidence support is a share of the portfolio; retention depends on the observed amount alone</title>
<desc id="desc">Above, a strip of the benchmark portfolio with part of it observed and the rest not run; a bracket under the observed cells marks evidence support as their share of the whole strip, between 0 and 100 percent. Below, score retention against supported benchmark weight: a floor while the weight is little, a smooth rise, and 100 percent once it is enough. The observed cells are laid along that axis as an amount, and a guide from their end meets the curve at full retention, although cells in the portfolio are still not run. Exact thresholds are stated in the accompanying text.</desc>
<style>
