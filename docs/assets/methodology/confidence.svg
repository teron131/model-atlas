<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">Evidence coverage and regularization are different measures</title>
<desc id="desc">The regularization coefficient rises from zero at evidence mass 0.75 to one at 7.5. For an illustrative portfolio of weight 40, coverage at that point is 18.75 percent and continues rising beyond it.</desc>
