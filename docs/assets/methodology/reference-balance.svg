ass="num big" x="464" y="268" text-anchor="middle">3</text>
<text class="strong" x="500" y="40">Model-balanced: 1 per model</text><text class="small muted" x="728" y="64" text-anchor="middle">Model</text><text class="small muted" x="728" y="79" text-anchor="middle">total</text><text class="small muted" x="521" y="162" text-anchor="middle">low</text><text class="small muted" x="563" y="162" text-anchor="middle">medium</text><text class="small muted" x="605" y="162" text-anchor="middle">high</text><text class="small muted" x="647" y="162" text-anchor="middle">xhigh</text><text class="small muted" x="689" y="162" text-anchor="middle">max</text><g><circle class="ink halo" cx="605" cy="112" r="10" filter="url(#glow)"/><circle class="ink ring" cx="605" cy="112" r="8"/></g><text class="num big strong" x="728" y="118" text-anchor="middle">1</text><g><circle class="ink halo" cx="521" cy="198" r="5.577708763999663" filter="url(#glow)"/><circle class="ink ring" cx="521" cy="198" r="3.5777087639996634"/></g><g><circle class="ink halo" cx="563" cy="198" r="5.577708763999663" filter="url(#glow)"/><circle class="ink ring" cx="563" cy="198" r="3.5777087639996634"/></g><g><circle class="ink halo" cx="605" cy="198" r="5.577708763999663" filter="url(#glow)"/><circle class="ink ring" cx="605" cy="198" r="3.5777087639996634"/></g><g><circle class="ink halo" cx="647" cy="198" r="5.577708763999663" filter="url(#glow)"/><circle class="ink ring" cx="647" cy="198" r="3.5777087639996634"/></g><g><circle class="ink halo" cx="689" cy="198" r="5.577708763999663" filter="url(#glow)"/><circle class="ink ring" cx="689" cy="198" r="3.5777087639996634"/></g><text class="small muted" x="521" y="226" text-anchor="middle">⅕</text><text class="small muted" x="563" y="226" text-anchor="middle">⅕</text><text class="small muted" x="605" y="226" text-anchor="middle">⅕</text><text class="small muted" x="647" y="226" text-anchor="middle">⅕</text><text class="small muted" x="689" y="226" text-anchor="middle">⅕</text><text class="num big strong" x="728" y="204" text-anch