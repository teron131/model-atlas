<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Variant counts share one model reference weight</title>
<desc id="desc">One observed variant has weight 1. Five observed efforts each have weight one fifth. When only low, high, and max have the required observations, each has weight one third; medium and xhigh are missing and contribute no weight.</desc>
<style>
text { font-family:"Avenir Next","Segoe UI",Arial,sans-serif; }
@media (prefers-color-scheme:dark) {
text { fill:#ffffff; }
[fill="#63706e"] { fill:#a6b2ae; } [stroke="#63706e"] { stroke:#a6b2ae; }
[fill="#b5bfbc"] { fill:#3c4846; } [stroke="#b5bfbc"] { stroke:#3c4846; }
[fill="#146cba"] { fill:#85bfff; } [stroke="#146cba"] { stroke:#85bfff; }
[fill="#a64d0c"] { fill:#ffbc7d; } [stroke="#a64d0c"] { stroke:#ffbc7d; }
}
</style>
<text x="40" y="35" font-size="22" fill="#000000" font-weight="600">Each model contributes one total reference weight</text>
<text x="40" y="64" font-size="16" fill="#000000">Count only efforts with the observations required for that calculation.</text>
<text x="40" y="105" font-size="18" fill="#000000" font-weight="600">One observed variant</text><rect x="40" y="119" width="350" height="38" fill="#146cba" opacity="0.22"/><text x="215" y="145" font-size="18" fill="#000000" text-anchor="middle">1</text><text x="450" y="145" font-size="17" fill="#000000">Total = 1</text>
<text x="40" y="202" font-size="18" fill="#000000" font-weight="600">All five efforts observed</text>
<text x="71" y="227" font-size="13" fill="#000000" text-anchor="middle">low</text><rect x="40" y="237" width="62" height="38" fill="#146cba" opacity="0.22"/><text x="71" y="262" font-size="18" fill="#000000" text-anchor="middle">⅕</text>
<text x="143" y="227" font-size="13" fill="#000000" text-anchor="middle">medium</text><rect x="112" y="237" width="62" height="38" fill="#146cba" opacity="0.22"/><text x="143" y="262" font-size="18" fill="#000000" text-anchor="middle">⅕</text>
<text x="215" y="227" font-size="13" fill="#000000" text-anchor="middle">high</text><rect x="184" y="237" width="62" height="38" fill="#146cba" opacity="0.22"/><text x="215" y="262" font-size="18" fill="#000000" text-anchor="middle">⅕</text>
<text x="287" y="227" font-size="13" fill="#000000" text-anchor="middle">xhigh</text><rect x="256" y="237" width="62" height="38" fill="#146cba" opacity="0.22"/><text x="287" y="262" font-size="18" fill="#000000" text-anchor="middle">⅕</text>
<text x="359" y="227" font-size="13" fill="#000000" text-anchor="middle">max</text><rect x="328" y="237" width="62" height="38" fill="#146cba" opacity="0.22"/><text x="359" y="262" font-size="18" fill="#000000" text-anchor="middle">⅕</text>
<text x="450" y="262" font-size="17" fill="#000000">Total = 1</text>
<text x="40" y="332" font-size="18" fill="#000000" font-weight="600">Only three efforts observed</text>
<text x="71" y="357" font-size="13" fill="#000000" text-anchor="middle">low</text><rect x="40" y="367" width="62" height="38" fill="#146cba" opacity="0.22"/><text x="71" y="392" font-size="18" fill="#000000" text-anchor="middle">⅓</text>
<text x="143" y="357" font-size="13" fill="#000000" text-anchor="middle">medium</text><rect x="112" y="367" width="62" height="38" fill="none" stroke="#63706e" stroke-dasharray="3 3"/><text x="143" y="392" font-size="12" fill="#000000" text-anchor="middle">missing</text>
<text x="215" y="357" font-size="13" fill="#000000" text-anchor="middle">high</text><rect x="184" y="367" width="62" height="38" fill="#146cba" opacity="0.22"/><text x="215" y="392" font-size="18" fill="#000000" text-anchor="middle">⅓</text>
<text x="287" y="357" font-size="13" fill="#000000" text-anchor="middle">xhigh</text><rect x="256" y="367" width="62" height="38" fill="none" stroke="#63706e" stroke-dasharray="3 3"/><text x="287" y="392" font-size="12" fill="#000000" text-anchor="middle">missing</text>
<text x="359" y="357" font-size="13" fill="#000000" text-anchor="middle">max</text><rect x="328" y="367" width="62" height="38" fill="#146cba" opacity="0.22"/><text x="359" y="392" font-size="18" fill="#000000" text-anchor="middle">⅓</text>
<text x="450" y="392" font-size="17" fill="#000000">Total = 1</text>
</svg>
