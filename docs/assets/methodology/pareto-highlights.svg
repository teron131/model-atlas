<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Pareto Balance and Pareto Value on the Intelligence and Value frontier</title>
<desc id="desc">Twelve illustrative models plotted by Value and Intelligence. The lit rim joins the five Pareto frontier models; fainter models are beaten on both scores. Pareto Balance, at Value 68 and Intelligence 76, touches the highest curve of equal Intelligence × Value. The median Intelligence is 52.5; among frontier models above it, the highest Value is 82, at Intelligence 58, which is Pareto Value. The frontier model at Value 90 has a higher Value but Intelligence 45, below the median, so it does not qualify.</desc>
