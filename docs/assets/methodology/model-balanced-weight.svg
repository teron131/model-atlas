<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
  <title id="title">Model-balanced reference weight</title>
  <desc id="desc">A model with one represented effort and a model with four represented efforts each contribute one total unit of calibration mass.</desc>
  <style>
    :root { --bg: #000000; --fg: #f5f5f5; --muted: #d4d4d4; --grid: #3f3f46; --primary: #60a5fa; --secondary: #fbbf24; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: var(--fg); }
    .label { font-size: 18px; }
    .annotation { font-size: 14px; font-weight: 600; }
    .muted { fill: var(--muted); font-size: 14px; }
    .group { fill: none; stroke: var(--grid); stroke-width: 1.5; rx: 4; }
    .variant { fill: var(--primary); }
    .variant-many { fill: var(--secondary); }
    .mass { stroke: var(--fg); stroke-width: 8; stroke-linecap: round; }
  </style>
  <rect width="720" height="350" fill="var(--bg)" />
  <text x="360" y="31" text-anchor="middle" class="label">Model-balanced reference weight</text>
  <rect x="70" y="59" width="250" height="220" class="group" />
  <text x="195" y="88" text-anchor="middle" class="annotation">Model A · one effort</text>
  <circle cx="195" cy="151" r="16" class="variant" />
  <text x="195" y="188" text-anchor="middle" class="annotation">variant weight = 1</text>
  <line x1="115" y1="244" x2="275" y2="244" class="mass" />
  <text x="195" y="268" text-anchor="middle" class="muted">total calibration mass = 1</text>
  <rect x="400" y="59" width="250" height="220" class="group" />
  <text x="525" y="88" text-anchor="middle" class="annotation">Model B · four efforts</text>
  <circle cx="450" cy="151" r="12" class="variant-many" />
  <circle cx="500" cy="151" r="12" class="variant-many" />
  <circle cx="550" cy="151" r="12" class="variant-many" />
  <circle cx="600" cy="151" r="12" class="variant-many" />
  <text x="525" y="188" text-anchor="middle" class="annotation">each variant weight = ¼</text>
  <line x1="445" y1="244" x2="605" y2="244" class="mass" />
  <text x="525" y="268" text-anchor="middle" class="muted">total calibration mass = 1</text>
  <text x="360" y="312" text-anchor="middle" class="annotation">More effort variants create more scored rows, not more reference influence</text>
</svg>
