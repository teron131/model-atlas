<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 458" role="img" aria-labelledby="title desc">
<title id="title">The same percentile can map to a different raw value</title>
<desc id="desc">Two illustrative model-balanced empirical distributions share percentile height. The weighted mean uses only direct observations on other selected benchmarks with positive weight in the same capability dimension, excluding the target and all imputed values. A weighted mean of 70 lies at the 45th-percentile midrank and maps to target value 0.58, not 0.70. Both distributions use the same ten equally weighted calibration observations, with tied values grouped.</desc>
