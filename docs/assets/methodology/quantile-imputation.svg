<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 458" role="img" aria-labelledby="title desc">
<title id="title">The same percentile can map to a different raw value</title>
<desc id="desc">Two illustrative model-balanced empirical distributions share percentile height. A context score of 70 lies at the 70th-percentile midrank and maps to target value 0.58, not 0.70. The two distributions use the same five paired calibration models.</desc>
<style>
text { font-family:"Avenir Next","Segoe UI",Arial,sans-serif; }
@media (prefers-color-scheme:dark) {
text { fill:#ffffff; }
[fill="#63706e"] { fill:#a6b2ae; } [stroke="#63706e"] { stroke:#a6b2ae; }
[fill="#b5bfbc"] { fill:#3c4846; } [stroke="#b5bfbc"] { stroke:#3c4846; }
[fill="#146cba"] { fill:#85bfff; } [stroke="#146cba"] { stroke:#85bfff; }
[fill="#a64d0c"] { fill:#ffbc7d; } [stroke="#a64d0c"] { stroke:#ffbc7d; }
}
</style>
