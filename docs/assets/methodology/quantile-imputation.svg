<text class="strong" x="536" y="44" text-anchor="middle">Missing benchmark</text><text class="small muted" x="536" y="64" text-anchor="middle">Reported metric</text><rect class="ink-wash" x="500" y="307" width="72" height="23" rx="3"/><text class="num" x="536" y="323.5" text-anchor="middle">0.12</text><rect class="ink-wash" x="500" y="259" width="72" height="46" rx="3"/><path class="guide" d="M504 282L514 282"/><path class="guide" d="M558 282L568 282"/><text class="num" x="536" y="287" text-anchor="middle">0.30</text><rect class="rose-wash" x="500" y="187" width="72" height="70" rx="3"/><path class="guide" d="M504 234L514 234"/><path class="guide" d="M558 234L568 234"/><path class="guide" d="M504 210L514 210"/><path class="guide" d="M558 210L568 210"/><text class="num strong" x="536" y="227" text-anchor="middle">0.58</text><rect class="ink-wash" x="500" y="90" width="72" height="95" rx="3"/><path class="guide" d="M504 162L514 162"/><path class="guide" d="M558 162L568 162"/><path class="guide" d="M504 138L514 138"/><path class="guide" d="M558 138L568 138"/><path class="guide" d="M504 114L514 114"/><path class="guide" d="M558 114L568 114"/><text class="num" x="536" y="142.5" text-anchor="middle">0.90</text><path class="axis" d="M572 330L576 330"/><text class="num muted" x="580" y="334.5">0%</text><path class="axis" d="M572 306L576 306"/><text class="num muted" x="580" y="310.5">10%</text><path class="axis" d="M572 258L576 258"/><text class="num muted" x="580" y="262.5">30%</text><path class="axis" d="M572 186L576 186"/><text class="num muted" x="580" y="190.5">60%</text><path class="axis" d="M572 90L576 90"/><text class="num muted" x="580" y="94.5">100%</text>
<path class="violet-line" d="M282 222L488 222" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tip-violet)"/>
<g><circle class="violet halo" cx="272" cy="222" r="8" filter="url(#glow)"/><circle class="violet ring" cx="272" cy="222" r="6"/></g><g><circle class="rose halo" cx="500" cy="222" r="8" filter="url(#glow)"/><circle class="rose ring" cx="500" cy="222" r="6"/></g>
<text class="num big strong" x="386" y="208" text-anchor="middle">45%</text>
</svg>
