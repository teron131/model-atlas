<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="title desc">
<title id="title">The same z-score on distributions with different spreads</title>
<desc id="desc">Two illustrative bell-shaped distributions share the same horizontal units. Benchmark A has mean forty and standard deviation ten; benchmark B has mean sixty and standard deviation twenty. The interval from mean to highlighted result is twice as wide on B, yet both results are one standard deviation above their mean. Bell shapes illustrate the example and are not an assumption of the linking method.</desc>
