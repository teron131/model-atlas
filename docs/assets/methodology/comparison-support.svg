<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" role="img" aria-labelledby="title desc">
<title id="title">Supported model count determines comparison strength</title>
<desc id="desc">Peer support is zero through a supported model count of one, rises smoothly to one at a count of three, and stays at one beyond it. Four peers with weight 0.5 each have total weight two and effective count four, giving supported count two and peer support 0.5.</desc>
<style>text{font-family:"Avenir Next","Segoe UI",Arial,sans-serif;fill:#182421}.muted{fill:#63706e}.grid{stroke:#b5bfbc;stroke-width:1}.guide{fill:none;stroke:#63706e;stroke-width:1;stroke-dasharray:4 5}.curve{fill:none;stroke:#146cba;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.point{fill:#146cba}.accent{fill:#146cba}@media(prefers-color-scheme:dark){text{fill:#ecf0ed}.muted{fill:#a6b2ae}.grid{stroke:#3c4846}.guide{fill:none;stroke:#a6b2ae}.curve{stroke:#85bfff}.point,.accent{fill:#85bfff}}</style>
<text x="90" y="28" font-size="18">Four other models</text>
<text x="680" y="28" font-size="15" text-anchor="end" class="muted">Weight per model: 0.5</text>
<rect x="100" y="50" width="80" height="40" rx="2" fill="none" class="grid"/>
<rect x="100" y="70" width="80" height="20" class="point"/>
<text x="140" y="115" font-size="15" text-anchor="middle" class="muted">Model 1</text>
<rect x="260" y="50" width="80" height="40" rx="2" fill="none" class="grid"/>
<rect x="260" y="70" width="80" height="20" class="point"/>
<text x="300" y="115" font-size="15" text-anchor="middle" class="muted">Model 2</text>
<rect x="420" y="50" width="80" height="40" rx="2" fill="none" class="grid"/>
<rect x="420" y="70" width="80" height="20" class="point"/>
<text x="460" y="115" font-size="15" text-anchor="middle" class="muted">Model 3</text>
<rect x="580" y="50" width="80" height="40" rx="2" fill="none" class="grid"/>
<rect x="580" y="70" width="80" height="20" class="point"/>
<text x="620" y="115" font-size="15" text-anchor="middle" class="muted">Model 4</text>
<path d="M140 128 H620 M220 128 V148 M540 128 V148" class="guide"/>
<text x="220" y="170" font-size="17" text-anchor="middle">Total weight</text>
<text x="220" y="198" font-size="20" text-anchor="middle" class="accent">4 × 0.5 = 2</text>
<text x="540" y="170" font-size="17" text-anchor="middle">Effective count</text>
<text x="540" y="198" font-size="20" text-anchor="middle">2² / (4 × 0.5²) = 4</text>
<path d="M220 209 V226 H540 V209 M380 226 V241" class="guide"/>
<text x="380" y="264" font-size="18" text-anchor="middle" class="accent">Smaller count: n = 2</text>
<g transform="translate(0 290)">
<text x="90" y="32" font-size="18">Peer support p</text>
<path d="M90 310 H680" class="grid"/>
<text x="72" y="315" font-size="16" text-anchor="end" class="muted">0</text>
<path d="M90 197.5 H680" class="grid"/>
<text x="72" y="202.5" font-size="16" text-anchor="end" class="muted">0.5</text>
<path d="M90 85 H680" class="grid"/>
<text x="72" y="90" font-size="16" text-anchor="end" class="muted">1</text>
<path d="M90.0 310 v6" class="grid"/>
<text x="90.0" y="339" font-size="16" text-anchor="middle" class="muted">0</text>
<path d="M237.5 310 v6" class="grid"/>
