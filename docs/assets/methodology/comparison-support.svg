<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">Supported model count determines comparison strength</title>
<desc id="desc">Four other models each carry peer weight 0.5 out of a possible 1. Their total weight is 2 and their effective count is 4, so the supported model count is the smaller value, 2. Peer support is zero through a supported count of 1, rises smoothly to 1 at a count of 3, and stays at 1 beyond it; a count of 2 gives half support.</desc>
<style>
text{font-family:"Avenir Next","Segoe UI",Arial,sans-serif;font-size:15px;fill:#202724}
