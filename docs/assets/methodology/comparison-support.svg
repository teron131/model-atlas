<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" role="img" aria-labelledby="title desc">
<title id="title">The smaller of total peer weight and effective count sets peer support</title>
<desc id="desc">Four other models each carry peer weight one half. Laid end to end on the count axis, their weights reach a total weight of 2; as four equal inputs, their effective count reaches 4. The supported model count is the smaller value, 2, and its guide drops to the peer-support curve, which is zero through a count of 1, rises smoothly to 1 at a count of 3, and gives half support at 2.</desc>
