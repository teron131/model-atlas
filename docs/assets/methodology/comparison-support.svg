<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" role="img" aria-labelledby="title desc">
<title id="title">Equally many peers give full support when near and little when distant</title>
<desc id="desc">Two sets of four peers under the Gaussian peer-weight curve, which is centred on the variant. Near peers sit close to the centre and keep almost their full weight; distant peers sit far out and keep little. Beside each set, a bar shows the total peer weight, long for the near peers and short for the distant ones. On the right, peer support against the supported model count, which is that total weight: zero up to a count of 1, rising smoothly to full support at 3. The near peers reach full support and the distant peers reach little.</desc>
