<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-labelledby="title desc">
<title id="title">Each step draws on evidence closer to the model but smaller in amount, and moves part of the way to its median</title>
<desc id="desc">Four steps on one axis of deviation from the other models' median log ratio, each drawing on evidence closer to the target model and smaller in amount than the step above. The other-models row holds the deviations of many other models that make the same change of effort, with a bracket over the ones from the target model's lab; the deviation starts at zero, their median ratio on the missing benchmark. The same-lab row holds the lab's other models, those under the bracket; the deviation moves a fraction r lab of the way to their median. The nearby-releases row holds the same lab models weighted by release date, drawn by point area; the deviation moves a fraction r near of the way to their weighted median. The target-model row holds the target model's own deviations on its other benchmarks; the deviation moves a fraction r own of the way to their median, which lies on the other side, so it moves back. A dotted line marks the distance each step leaves uncovered, and the last deviation drops to the axis as delta own.</desc>
<style>
