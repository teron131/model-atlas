<g><circle class="violet halo" cx="578.696" cy="250" r="7.5" filter="url(#glow)"/><circle class="violet ring" cx="578.696" cy="250" r="5.5"/></g>
<g><circle class="ink halo" cx="664" cy="160" r="7.5" filter="url(#glow)"/><circle class="ink ring" cx="664" cy="160" r="5.5"/></g>
<g><circle class="violet halo" cx="610" cy="250" r="7.5" filter="url(#glow)"/><circle class="violet ring" cx="610" cy="250" r="5.5"/></g>
<g><circle class="ink halo" cx="610" cy="70" r="7" filter="url(#glow)"/><circle class="ink ring" cx="610" cy="70" r="5"/></g>
</svg>
