<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
<title id="title">Three shared benchmarks approach an effective count of one as one weight dominates</title>
<desc id="desc">One benchmark takes a growing share of total weight; the other two split the remainder equally. Weights 1, 1, 1 give an effective count of 3; weights 1, 2, 1 give 2.67; weights 1, 8, 1 give 1.52. The count approaches 1 as the largest share approaches 100 percent, a limit the curve does not reach.</desc>
