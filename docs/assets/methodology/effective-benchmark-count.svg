<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">Three shared benchmarks approach an effective count of one as one weight dominates</title>
<desc id="desc">One benchmark takes a growing share of total weight; the other two split the remainder equally. Weights 1, 1, 1 give count 3; weights 1, 2, 1 give 2.67; weights 1, 8, 1 give 1.52. The open endpoint at 100 percent is the limit, where the other weights approach zero.</desc>
