<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
<title id="title">Effective count falls as one weight dominates</title>
<desc id="desc">Four inputs share one total weight. One input takes a growing share while the others split the rest equally. Equal shares give an effective count equal to the number of inputs, n. As the largest share grows, the count falls along a curve toward 1, reaching it only when one input holds all the weight.</desc>
