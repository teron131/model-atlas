<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">A shared coverage multiplier scales each effort by the same amount</title>
<desc id="desc">For illustrative effort means of 75 and 25, the shared reference variant's evidence support of 35 percent gives a shared coverage multiplier of one half, so the final scores are 37.5 and 12.5. The multiplier is zero through 10 percent evidence support and reaches one at 60 percent, so each final score scales toward zero, the mean below 50 as well as the one above it, rather than toward a neutral 50.</desc>
