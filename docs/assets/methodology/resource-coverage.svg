<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" role="img" aria-labelledby="title desc">
<title id="title">A shared coverage ramp scales each effort by the same multiplier</title>
<desc id="desc">For illustrative effort means 80 and 60, default coverage 35 percent applies multiplier 0.5 and produces scores 40 and 30. The ramp is zero through 10 percent coverage and complete at 60 percent. Each effort still reports its own evidence share.</desc>
