<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 62 760 270" role="img" aria-labelledby="title desc">
<title id="title">Data Imputation</title>
<desc id="desc">A row of eleven values contains three hollow gaps. Three estimated values below point upward into those gaps.</desc>
<style>
text { font-family:"Avenir Next","Segoe UI",Arial,sans-serif; fill:#000000; }
.observed { fill:#202823; }
.gap { fill:none; stroke:#63706e; stroke-width:1.8; }
.estimate { fill:#478d83; }
.guide { fill:none; stroke:#b5bfbc; stroke-width:1.25; }
.arrow { fill:none; stroke:#478d83; stroke-width:1.8; }
.head { fill:#478d83; }
@media (prefers-color-scheme:dark) {
text { fill:#ffffff; }
.observed { fill:#e5eae6; }
.gap { stroke:#a6b2ae; }
.estimate,.head { fill:#8ac7bc; }
.arrow { stroke:#8ac7bc; }
.guide { stroke:#63706e; }
}
</style>
