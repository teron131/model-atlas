<path class="ink-line" d="M358 228Q302 256 246 228" stroke-width="1.5" stroke-dasharray="0.5 4" stroke-linecap="round" stroke-opacity=".55"/>
<path class="ink-line" d="M414 228Q330 168 246 228" stroke-width="1.5" stroke-dasharray="0.5 4" stroke-linecap="round" stroke-opacity=".55"/>
