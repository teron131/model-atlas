<text x="40" y="89">Model 1 · max</text><path class="grid" d="M166 84L494 84"/><g><circle class="ink halo" cx="190" cy="84" r="8" filter="url(#glow)"/><circle class="ink ring" cx="190" cy="84" r="6"/></g><g><circle class="ink halo" cx="246" cy="84" r="8" filter="url(#glow)"/><circle class="ink ring" cx="246" cy="84" r="6"/></g><g><circle class="ink halo" cx="302" cy="84" r="8" filter="url(#glow)"/><circle class="ink ring" cx="302" cy="84" r="6"/></g><g><circle class="ink halo" cx="358" cy="84" r="8" filter="url(#glow)"/><circle class="ink ring" cx="358" cy="84" r="6"/></g><g><circle class="ink halo" cx="414" cy="84" r="8" filter="url(#glow)"/><circle class="ink ring" cx="414" cy="84" r="6"/></g><g><circle class="ink halo" cx="470" cy="84" r="8" filter="url(#glow)"/><circle class="ink ring" cx="470" cy="84" r="6"/></g>
<text x="40" y="137">Model 1 · high</text><path class="grid" d="M166 132L494 132"/><g><circle class="ink halo" cx="190" cy="132" r="8" filter="url(#glow)"/><circle class="ink ring" cx="190" cy="132" r="6"/></g><g><circle class="ink halo" cx="246" cy="132" r="8" filter="url(#glow)"/><circle class="ink ring" cx="246" cy="132" r="6"/></g><g><circle class="ink halo" cx="302" cy="132" r="8" filter="url(#glow)"/><circle class="ink ring" cx="302" cy="132" r="6"/></g><g><circle class="rose halo" cx="358" cy="132" r="8" filter="url(#glow)"/><circle class="rose ring" cx="358" cy="132" r="6"/></g><g><circle class="ink halo" cx="414" cy="132" r="8" filter="url(#glow)"/><circle class="ink ring" cx="414" cy="132" r="6"/></g><g><circle class="ink halo" cx="470" cy="132" r="8" filter="url(#glow)"/><circle class="ink ring" cx="470" cy="132" r="6"/></g><text class="muted" x="510" y="137">From another effort</text>
<text x="40" y="185">Model 1 · low</text><path class="grid" d="M166 180L494 180"/><g><circle class="ink halo" cx="190" cy="180" r="8" filter="url(#glow)"/><circle class="ink ring" cx="190" cy="180" r="6"/></g><g><circle class="ink halo" cx="246" cy="180" r="8" filter="url(#glow)"/><circle class="ink ring" cx="246" cy="180" r="6"/></g><g><circle class="ink halo" cx="302" cy="180" r="8" filter="url(#glow)"/><circle class="ink ring" cx="302" cy="180" r="6"/></g><g><circle class="rose halo" cx="358" cy="180" r="8" filter="url(#glow)"/><circle class="rose ring" cx="358" cy="180" r="6"/></g><g><circle class="rose halo" cx="414" cy="180" r="8" filter="url(#glow)"/><circle class="rose ring" cx="414" cy="180" r="6"/></g><g><circle class="rose halo" cx="470" cy="180" r="8" filter="url(#glow)"/><circle class="rose ring" cx="470" cy="180" r="6"/></g>
<text x="40" y="233">Model 2</text><path class="grid" d="M166 228L494 228"/><g><circle class="ink halo" cx="190" cy="228" r="8" filter="url(#glow)"/><circle class="ink ring" cx="190" cy="228" r="6"/></g><g><circle class="rose halo" cx="246" cy="228" r="8" filter="url(#glow)"/><circle class="rose ring" cx="246" cy="228" r="6"/></g><g><circle class="ink halo" cx="302" cy="228" r="8" filter="url(#glow)"/><circle class="ink ring" cx="302" cy="228" r="6"/></g><g><circle class="ink halo" cx="358" cy="228" r="8" filter="url(#glow)"/><circle class="ink ring" cx="358" cy="228" r="6"/></g><g><circle class="ink halo" cx="414" cy="228" r="8" filter="url(#glow)"/><circle class="ink ring" cx="414" cy="228" r="6"/></g><g><circle class="ink halo" cx="470" cy="228" r="8" filter="url(#glow)"/><circle class="ink ring" cx="470" cy="228" r="6"/></g><text class="muted" x="510" y="233">From other benchmarks</text>
<text x="40" y="281">Model 3</text><path class="grid" d="M166 276L494 276"/><g><circle class="ink halo" cx="190" cy="276" r="8" filter="url(#glow)"/><circle class="ink ring" cx="190" cy="276" r="6"/></g><g><circle class="ink halo" cx="246" cy="276" r="8" filter="url(#glow)"/><circle class="ink ring" cx="246" cy="276" r="6"/></g><path class="axis" d="M296 276L308 276" stroke-width="1.5"/><path class="axis" d="M352 276L364 276" stroke-width="1.5"/><path class="axis" d="M408 276L420 276" stroke-width="1.5"/><path class="axis" d="M464 276L476 276" stroke-width="1.5"/><text class="muted" x="510" y="281">Too little evidence: stays missing</text>
