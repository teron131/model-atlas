<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Resource efficiency is a vertical gap within a local quality neighborhood</title>
<desc id="desc">Above, Gaussian peer weights with width 0.5: a quality distance of 0.5 keeps 61 percent of a peer's weight and a distance of 1 keeps 14 percent. Below, peers share that horizontal quality-distance axis and fade with their weight. Their weighted local trend on a log-time scale predicts 100 seconds at the target's quality; the target model uses 50 seconds, a log residual of ln(50/100), about minus 0.693.</desc>
