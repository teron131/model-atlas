<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 538" role="img" aria-labelledby="title desc">
<title id="title">Resource efficiency is a vertical gap within a local quality neighborhood</title>
<desc id="desc">The upper Gaussian curve shows quality distance weights at width 0.5. Peer dots below share that horizontal coordinate and fade with distance. Illustrative symmetric independent peers support a local log-time trend predicting 100 seconds at the focal quality; the focal model uses 50 seconds, a log residual of minus 0.693.</desc>
