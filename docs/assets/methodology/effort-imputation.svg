<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" role="img" aria-labelledby="title desc">
<title id="title">The weighted gap on shared benchmarks fills the missing one</title>
<desc id="desc">The same model at medium and high effort. On three shared benchmarks, high effort scores higher on two and lower on one; point area shows each shared benchmark's weight, labelled higher or lower: Benchmark B counts twice as much as A and C. Below, each benchmark's gap is redrawn from one zero at the same areas; the weighted mean gap, delta, is their balance point. Benchmark D is observed only at medium effort, so its high-effort estimate is its medium result shifted by delta, directly under the balance point. The values are illustrative.</desc>
<style>
text{font-family:"Avenir Next","Segoe UI",Arial,sans-serif;font-size:15px;fill:#202724}
.num{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,monospace;font-size:14px}
.small{font-size:12.5px}.big{font-size:18px}.strong{font-weight:600}
.muted{fill-opacity:.62}.faint{opacity:.4}.half{opacity:.5}
.grid{fill:none;stroke:#202724;stroke-opacity:.09}
.guide{fill:none;stroke:#202724;stroke-opacity:.22}
.axis{fill:none;stroke:#202724;stroke-opacity:.34}
.ink{fill:#202724}.ink-line{fill:none;stroke:#202724}.ink-wash{fill:#202724;fill-opacity:.08}
.ring{stroke:#f2f4f2;stroke-width:2;paint-order:stroke}.gap{stroke:#f2f4f2;stroke-width:2}
.violet{fill:#6b47e0}.violet-line{fill:none;stroke:#6b47e0}.violet-wash{fill:#6b47e0;fill-opacity:.14}
.rose{fill:#c93f78}.rose-line{fill:none;stroke:#c93f78}.rose-wash{fill:#c93f78;fill-opacity:.14}
.amber{fill:#a8740c}.amber-line{fill:none;stroke:#a8740c}.amber-wash{fill:#a8740c;fill-opacity:.16}
.h0{stop-color:#3557e6}.h1{stop-color:#6b47e0}.h2{stop-color:#d9467f}
.land0{stop-color:#6b47e0;stop-opacity:.12}.land1{stop-color:#6b47e0;stop-opacity:.01}
.halo{opacity:0}
.m{font-size:1.12em}.mr,.mi,.mb{font-family:"KaTeX_Main","Latin Modern Roman","STIX Two Text","Cambria","Times New Roman",serif;font-style:normal;font-weight:400}.mb{font-weight:700}.mi{font-family:"KaTeX_Math","Latin Modern Math","STIX Two Text","Cambria Math","Times New Roman",serif;font-style:italic}
@media (prefers-color-scheme:dark){
text{fill:#f2f3ed}.muted{fill-opacity:.58}
.grid{stroke:#f2f3ed;stroke-opacity:.08}.guide{stroke:#f2f3ed;stroke-opacity:.2}.axis{stroke:#f2f3ed;stroke-opacity:.3}
.ink{fill:#f2f3ed}.ink-line{stroke:#f2f3ed}.ink-wash{fill:#f2f3ed;fill-opacity:.1}
.ring{stroke:#0b1016}.gap{stroke:#0b1016}
.violet{fill:#8f6bff}.violet-line{stroke:#8f6bff}.violet-wash{fill:#8f6bff;fill-opacity:.22}
.rose{fill:#e06296}.rose-line{stroke:#e06296}.rose-wash{fill:#e06296;fill-opacity:.2}
.amber{fill:#b98b24}.amber-line{stroke:#b98b24}.amber-wash{fill:#b98b24;fill-opacity:.22}
.h0{stop-color:#4a72ff}.h1{stop-color:#8f6bff}.h2{stop-color:#ff92bd}
.land0{stop-color:#6f8cff;stop-opacity:.16}.land1{stop-color:#6f8cff;stop-opacity:.02}
.halo{opacity:.55}
}
</style>
<defs><filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter><marker id="tip-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="violet" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="rose" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="amber" d="M0 0L10 5L0 10Z"/></marker></defs>
<path class="ink ring" d="M46 24L52 30L46 36L40 30Z"/><text class="muted" x="60" y="35">Medium effort</text><g><circle class="ink halo" cx="186" cy="30" r="7.5" filter="url(#glow)"/><circle class="ink ring" cx="186" cy="30" r="5.5"/></g><text class="muted" x="200" y="35">High effort</text><g><circle class="rose halo" cx="312" cy="30" r="7.5" filter="url(#glow)"/><circle class="rose ring" cx="312" cy="30" r="5.5"/></g><text class="muted" x="326" y="35">Estimated high effort</text><text class="small muted" x="690" y="35" text-anchor="end">Point area = weight</text>
<text x="40" y="101">Benchmark A</text><text class="small muted" x="150" y="101">Lower weight</text><path class="ink-line" d="M522.3 96L595.4 96" stroke-width="1.5" stroke-opacity=".6" marker-end="url(#tip-ink)"/><path class="ink ring" d="M513.3 90L519.3 96L513.3 102L507.3 96Z"/><g><circle class="ink halo" cx="604.4" cy="96" r="7.5" filter="url(#glow)"/><circle class="ink ring" cx="604.4" cy="96" r="5.5"/></g><text x="40" y="151">Benchmark B</text><text class="small muted" x="150" y="151">Higher weight</text><path class="ink-line" d="M433.7 146L456.5 146" stroke-width="1.5" stroke-opacity=".6" marker-end="url(#tip-ink)"/><path class="ink ring" d="M422.2 137.5L430.7 146L422.2 154.5L413.7 146Z"/><g><circle class="ink halo" cx="467.8" cy="146" r="9.778174593052023" filter="url(#glow)"/><circle class="ink ring" cx="467.8" cy="146" r="7.778174593052023"/></g><text x="40" y="201">Benchmark C</text><text class="small muted" x="150" y="201">Lower weight</text><path class="ink-line" d="M322.1 196L294.6 196" stroke-width="1.5" stroke-opacity=".6" marker-end="url(#tip-ink)"/><path class="ink ring" d="M331.1 190L337.1 196L331.1 202L325.1 196Z"/><g><circle class="ink halo" cx="285.6" cy="196" r="7.5" filter="url(#glow)"/><circle class="ink ring" cx="285.6" cy="196" r="5.5"/></g>
<text class="muted" x="40" y="274">Gap</text>
<path class="guide" d="M513.3 242L513.3 308"/>
<path class="ink-line" d="M513.3 252L596.9 252" stroke-width="1.5" stroke-opacity=".6"/><g><circle class="ink halo" cx="604.4" cy="252" r="7.5" filter="url(#glow)"/><circle class="ink ring" cx="604.4" cy="252" r="5.5"/></g><text class="small muted" x="505.3" y="256.5" text-anchor="end">A</text><path class="ink-line" d="M513.3 270L549.1 270" stroke-width="1.5" stroke-opacity=".6"/><g><circle class="ink halo" cx="558.9" cy="270" r="9.778174593052023" filter="url(#glow)"/><circle class="ink ring" cx="558.9" cy="270" r="7.778174593052023"/></g><text class="small muted" x="505.3" y="274.5" text-anchor="end">B</text><path class="ink-line" d="M513.3 288L475.3 288" stroke-width="1.5" stroke-opacity=".6"/><g><circle class="ink halo" cx="467.8" cy="288" r="7.5" filter="url(#glow)"/><circle class="ink ring" cx="467.8" cy="288" r="5.5"/></g><text class="small muted" x="521.3" y="292.5">C</text>
<path class="axis" d="M404 308L640.9 308"/><text class="num muted" x="513.3" y="330" text-anchor="middle">0</text>
<path class="violet" d="M547.5 311l7 12h-14z"/><text class="num" x="559.5" y="323"><tspan class="m"><tspan class="mi">Δ</tspan></tspan></text>
<path class="ink-line" d="M547.5 325L547.5 353" stroke-width="1.5" stroke-dasharray="0.5 4" stroke-linecap="round" stroke-opacity=".55"/>
<text x="40" y="367">Benchmark D</text><path class="violet-line" d="M522.3 362L539.5 362" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#tip-violet)"/><path class="ink ring" d="M513.3 356L519.3 362L513.3 368L507.3 362Z"/><g><circle class="rose halo" cx="547.5" cy="362" r="7.5" filter="url(#glow)"/><circle class="rose ring" cx="547.5" cy="362" r="5.5"/></g>
</svg>
