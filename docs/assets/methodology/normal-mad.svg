<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 65 1000 475" role="img" aria-labelledby="title desc">
<title id="title">Median absolute deviation on a normal distribution</title>
<desc id="desc">The central 50 percent of a normal distribution lies between minus and plus 0.67449 standard deviations from its center. This distance is the median absolute deviation. The blue bracket spans one MAD; the longer bracket spans one standard deviation. This is an illustration, not measured token data.</desc>
