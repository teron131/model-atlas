<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" role="img" aria-labelledby="title desc">
<title id="title">Task and index weighting by direct evidence</title>
<desc id="desc">The first direct task receives 20 percent weight. Tasks reach 80 percent at the configured count threshold, shown as 8. With no direct tasks, indexes receive all weight.</desc>
