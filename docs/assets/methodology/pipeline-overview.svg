<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Model Atlas scoring pipeline</title>
  <desc id="desc">Benchmark evidence produces Intelligence and Agentic scores, which condition resource comparisons that combine with price and runtime inputs to produce Speed and Value without feeding resources back into capability.</desc>
  <style>
    :root { --bg: #000000; --fg: #f5f5f5; --muted: #d4d4d4; --grid: #3f3f46; --primary: #60a5fa; --secondary: #fbbf24; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: var(--fg); }
    .label { font-size: 18px; }
    .annotation { font-size: 14px; font-weight: 600; }
    .muted { fill: var(--muted); font-size: 14px; }
    .box { fill: none; stroke: var(--grid); stroke-width: 1.5; rx: 4; }
    .capability { stroke: var(--primary); stroke-width: 2; }
    .delivery { stroke: var(--secondary); stroke-width: 2; }
    .arrow { fill: none; stroke: var(--muted); stroke-width: 2; marker-end: url(#arrow); }
    .capability-arrow { stroke: var(--primary); marker-end: url(#capability-arrow); }
    .delivery-arrow { stroke: var(--secondary); marker-end: url(#delivery-arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="var(--muted)" /></marker>
    <marker id="capability-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="var(--primary)" /></marker>
    <marker id="delivery-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="var(--secondary)" /></marker>
  </defs>
  <rect width="720" height="420" fill="var(--bg)" />
  <text x="360" y="31" text-anchor="middle" class="label">Model Atlas scoring pipeline</text>
  <text x="42" y="64" class="annotation">Capability</text>
  <rect x="42" y="78" width="160" height="82" class="box capability" />
  <text x="122" y="110" text-anchor="middle" class="annotation">Benchmark evidence</text>
  <text x="122" y="134" text-anchor="middle" class="muted">model × effort results</text>
  <rect x="280" y="78" width="160" height="82" class="box capability" />
  <text x="360" y="110" text-anchor="middle" class="annotation">Normalize + weight</text>
  <text x="360" y="134" text-anchor="middle" class="muted">evidence and coverage</text>
  <rect x="518" y="78" width="160" height="82" class="box capability" />
  <text x="598" y="108" text-anchor="middle" class="annotation">Intelligence</text>
  <text x="598" y="132" text-anchor="middle" class="annotation">and Agentic</text>
  <line x1="202" y1="119" x2="270" y2="119" class="arrow capability-arrow" />
  <line x1="440" y1="119" x2="508" y2="119" class="arrow capability-arrow" />
  <text x="42" y="229" class="annotation">Delivery constraints</text>
  <rect x="42" y="243" width="160" height="92" class="box delivery" />
  <text x="122" y="274" text-anchor="middle" class="annotation">Price and runtime</text>
  <text x="122" y="298" text-anchor="middle" class="muted">provider and task data</text>
  <rect x="280" y="243" width="160" height="92" class="box delivery" />
  <text x="360" y="274" text-anchor="middle" class="annotation">Quality-adjusted</text>
  <text x="360" y="298" text-anchor="middle" class="annotation">resource comparison</text>
  <rect x="518" y="243" width="160" height="92" class="box delivery" />
  <text x="598" y="274" text-anchor="middle" class="annotation">Speed</text>
  <text x="598" y="298" text-anchor="middle" class="annotation">and Value</text>
  <line x1="202" y1="289" x2="270" y2="289" class="arrow delivery-arrow" />
  <line x1="440" y1="289" x2="508" y2="289" class="arrow delivery-arrow" />
  <path d="M598 160 V198 H360 V233" class="arrow capability-arrow" />
  <text x="458" y="190" text-anchor="middle" class="muted">quality sets comparable peers</text>
  <text x="360" y="381" text-anchor="middle" class="annotation">Price and speed never feed back into capability</text>
</svg>
