<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
<title id="title">Inequalities form one order, and the joint target steps down along it</title>
<desc id="desc">Left, the inequalities A ≥ B ≥ C &gt; D ≥ E &gt; F &gt; G and E &gt; H merge into one order: a chain from A to G, with H below E and unresolved against F and G. Right, each model's Intelligence score plotted against its place, on an axis from 70 to 95. B, C and D, whose scores contradict the order, each get a target point, and all three sit at one pooled level, their mean; A, E, F, G and H agree, so each keeps its own score as its target. Arrows point from each contradicting model's score toward its target point, and a filled point marks where the 40% pull leaves it. Under each model is its place: exact for A to E, and the ranges #6–7, #7–8 and #6–8 for F, G and H.</desc>
