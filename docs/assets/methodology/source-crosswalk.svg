<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 656" role="img" aria-labelledby="title desc">
<title id="title">Paired models fit and validate a source crosswalk; single-source models borrow it</title>
<desc id="desc">Ten illustrative models on a shared 0 to 1 score scale, with source A on the upper lane and source B on the lower lane of each row. The first six report both sources, as many as the method requires; two of them report identical results, and the others differ by small amounts. Their typical difference B minus A, delta, is 0.02, shown as a dashed line in the right-hand column, where each paired model's own difference is a bar from zero; the two identical pairs have none. The remaining four report one source; their missing counterpart is the observed source shifted by delta, so their bars in the right-hand column reach exactly to it, and their combined mean carries a band of plus or minus e showing typical prediction error rather than a confidence interval. At the bottom, the validation error e from predicting each paired model with the others' offset, 0.02, falls inside the limit, so the crosswalk is accepted.</desc>
