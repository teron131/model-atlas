<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 72 1040 513" role="img" aria-labelledby="title desc">
<title id="title">Source crosswalk and validation error epsilon</title>
<desc id="desc">Two source number lines feed one combined result. Solid fusion points show the mean of two observations; hollow points use a mapped source counterpart. Shaded bands around hollow points show an illustrative typical prediction error of plus or minus epsilon, here 0.02. These are not confidence intervals or guaranteed bounds. Missing counterparts use an assumed validated offset of 0.02 from a larger calibration population. A separate illustrative rejected crosswalk is marked with an X: validation error 0.04 exceeds the allowed 0.025, so its missing-source predictions are not used. The typical-error bands do not reject individual results.</desc>
<style>
text { font-family:"Avenir Next","Segoe UI",Arial,sans-serif; fill:#182421; }
.muted { fill:#63706e; } .axis { stroke:#63706e; stroke-width:1.4; }
.link { fill:none; stroke:#8c9994; stroke-width:1.5; stroke-dasharray:2 6; opacity:.65; }
.a { color:#146cba; } .b { color:#a64d0c; } .f { color:#087f6b; }
.ink { fill:currentColor; } .rejected { color:#b33f3f; }
@media (prefers-color-scheme:dark) {
text { fill:#ffffff; } .muted { fill:#a6b2ae; }
.axis { stroke:#a6b2ae; } .link { stroke:#8c9994; }
.rejected { color:#ff9696; }
.a { color:#85bfff; } .b { color:#ffbc7d; } .f { color:#62d6b1; }
}
</style>

