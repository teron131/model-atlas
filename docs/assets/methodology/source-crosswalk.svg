<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">Seven models connected across source A, fusion, and source B</title>
<desc id="desc">Source A has six observed models and source B has four, including B-only Model F. Dotted lines connect only observed source scores to their fusion result. Missing source points are absent. Hollow fusion points indicate an estimated aggregate. Model B agrees exactly, Model C is higher in source B, and Model D is higher in source A. Only missing counterparts use an assumed validated offset of 0.02 from a larger calibration population.</desc>
