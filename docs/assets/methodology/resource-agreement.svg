<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Raw resource amounts combine only when paired amounts agree within 5%</title>
<desc id="desc">Two schematic panels, each point pairing one model's per-task amounts from Source A and Source B on log scales spanning about a factor of 3. The violet band marks amounts within a factor of 1.05 of each other, and pairs inside it are violet. On the left, two pairs agree exactly, nine more fall inside the band and one misses it, so at least 90 percent agree and the raw amounts are averaged. On the right, every pair is about 15 percent apart: the sources move together, but none falls within the band, no offset is fitted, and the sources are scored separately.</desc>
<style>
text{font-family:"Avenir Next","Segoe UI",Arial,sans-serif;font-size:15px;fill:#202724}
.num{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,monospace;font-size:14px}
.small{font-size:12.5px}.big{font-size:18px}.strong{font-weight:600}
.muted{fill-opacity:.62}.faint{opacity:.4}.half{opacity:.5}
.grid{fill:none;stroke:#202724;stroke-opacity:.09}
.guide{fill:none;stroke:#202724;stroke-opacity:.22}
.axis{fill:none;stroke:#202724;stroke-opacity:.34}
.ink{fill:#202724}.ink-line{fill:none;stroke:#202724}.ink-wash{fill:#202724;fill-opacity:.08}
.ring{stroke:#f2f4f2;stroke-width:2;paint-order:stroke}.gap{stroke:#f2f4f2;stroke-width:2}
.violet{fill:#6b47e0}.violet-line{fill:none;stroke:#6b47e0}.violet-wash{fill:#6b47e0;fill-opacity:.14}
.rose{fill:#c93f78}.rose-line{fill:none;stroke:#c93f78}.rose-wash{fill:#c93f78;fill-opacity:.14}
.amber{fill:#a8740c}.amber-line{fill:none;stroke:#a8740c}.amber-wash{fill:#a8740c;fill-opacity:.16}
.h0{stop-color:#3557e6}.h1{stop-color:#6b47e0}.h2{stop-color:#d9467f}
.land0{stop-color:#6b47e0;stop-opacity:.12}.land1{stop-color:#6b47e0;stop-opacity:.01}
.halo{opacity:0}
.m{font-size:1.12em}.mr,.mi,.mb{font-family:"KaTeX_Main","Latin Modern Roman","STIX Two Text","Cambria","Times New Roman",serif;font-style:normal;font-weight:400}.mb{font-weight:700}.mi{font-family:"KaTeX_Math","Latin Modern Math","STIX Two Text","Cambria Math","Times New Roman",serif;font-style:italic}
@media (prefers-color-scheme:dark){
text{fill:#f2f3ed}.muted{fill-opacity:.58}
.grid{stroke:#f2f3ed;stroke-opacity:.08}.guide{stroke:#f2f3ed;stroke-opacity:.2}.axis{stroke:#f2f3ed;stroke-opacity:.3}
.ink{fill:#f2f3ed}.ink-line{stroke:#f2f3ed}.ink-wash{fill:#f2f3ed;fill-opacity:.1}
.ring{stroke:#0b1016}.gap{stroke:#0b1016}
.violet{fill:#8f6bff}.violet-line{stroke:#8f6bff}.violet-wash{fill:#8f6bff;fill-opacity:.22}
.rose{fill:#e06296}.rose-line{stroke:#e06296}.rose-wash{fill:#e06296;fill-opacity:.2}
.amber{fill:#b98b24}.amber-line{stroke:#b98b24}.amber-wash{fill:#b98b24;fill-opacity:.22}
.h0{stop-color:#4a72ff}.h1{stop-color:#8f6bff}.h2{stop-color:#ff92bd}
.land0{stop-color:#6f8cff;stop-opacity:.16}.land1{stop-color:#6f8cff;stop-opacity:.02}
.halo{opacity:.55}
}
</style>
<defs><filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter><marker id="tip-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="violet" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="rose" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="amber" d="M0 0L10 5L0 10Z"/></marker></defs>
<path class="violet-wash" d="M80 346.9L356.9 70L370 70L370 83.1L93.1 360L80 360Z"/><path class="guide" d="M80 360L370 70"/>
<path class="axis" d="M80 70L80 360"/><path class="axis" d="M80 360L370 360"/>
<text class="small muted" x="350.9" y="62" text-anchor="end">Within 5%</text>
<g><circle class="violet halo" cx="104.7" cy="335.3" r="6.5" filter="url(#glow)"/><circle class="violet ring" cx="104.7" cy="335.3" r="4.5"/></g><g><circle class="violet halo" cx="123.2" cy="309.4" r="6.5" filter="url(#glow)"/><circle class="violet ring" cx="123.2" cy="309.4" r="4.5"/></g><g><circle class="violet halo" cx="154" cy="291.5" r="6.5" filter="url(#glow)"/><circle class="violet ring" cx="154" cy="291.5" r="4.5"/></g><g><circle class="violet halo" cx="166.4" cy="271.1" r="6.5" filter="url(#glow)"/><circle class="violet ring" cx="166.4" cy="271.1" r="4.5"/></g><g><circle class="violet halo" cx="197.2" cy="253.3" r="6.5" filter="url(#glow)"/><circle class="violet ring" cx="197.2" cy="253.3" r="4.5"/></g><g><circle class="violet halo" cx="215.7" cy="224.3" r="6.5" filter="url(#glow)"/><circle class="violet ring" cx="215.7" cy="224.3" r="4.5"/></g><g><circle class="violet halo" cx="221.9" cy="208.2" r="6.5" filter="url(#glow)"/><circle class="violet ring" cx="221.9" cy="208.2" r="4.5"/></g><g><circle class="ink halo" cx="252.8" cy="155.1" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="252.8" cy="155.1" r="4.5"/></g><g><circle class="violet halo" cx="271.3" cy="171.8" r="6.5" filter="url(#glow)"/><circle class="violet ring" cx="271.3" cy="171.8" r="4.5"/></g><g><circle class="violet halo" cx="283.6" cy="150.8" r="6.5" filter="url(#glow)"/><circle class="violet ring" cx="283.6" cy="150.8" r="4.5"/></g><g><circle class="violet halo" cx="314.5" cy="133.6" r="6.5" filter="url(#glow)"/><circle class="violet ring" cx="314.5" cy="133.6" r="4.5"/></g><g><circle class="violet halo" cx="326.8" cy="102.1" r="6.5" filter="url(#glow)"/><circle class="violet ring" cx="326.8" cy="102.1" r="4.5"/></g>
<text class="muted" x="80" y="54">Source B amount</text><text x="225" y="388" text-anchor="middle">Source A amount</text>
<text class="strong" x="80" y="422">At least 90% within 5%</text><text class="muted" x="80" y="444">Raw amounts averaged</text>
<path class="violet-wash" d="M430 346.9L706.9 70L720 70L720 83.1L443.1 360L430 360Z"/><path class="guide" d="M430 360L720 70"/>
<path class="axis" d="M430 70L430 360"/><path class="axis" d="M430 360L720 360"/>

<g><circle class="ink halo" cx="454.7" cy="299.5" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="454.7" cy="299.5" r="4.5"/></g><g><circle class="ink halo" cx="473.2" cy="277.3" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="473.2" cy="277.3" r="4.5"/></g><g><circle class="ink halo" cx="504" cy="252" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="504" cy="252" r="4.5"/></g><g><circle class="ink halo" cx="516.4" cy="236" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="516.4" cy="236" r="4.5"/></g><g><circle class="ink halo" cx="547.2" cy="202" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="547.2" cy="202" r="4.5"/></g><g><circle class="ink halo" cx="565.7" cy="189.1" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="565.7" cy="189.1" r="4.5"/></g><g><circle class="ink halo" cx="571.9" cy="179.8" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="571.9" cy="179.8" r="4.5"/></g><g><circle class="ink halo" cx="602.8" cy="150.8" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="602.8" cy="150.8" r="4.5"/></g><g><circle class="ink halo" cx="621.3" cy="128.6" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="621.3" cy="128.6" r="4.5"/></g><g><circle class="ink halo" cx="633.6" cy="121.8" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="633.6" cy="121.8" r="4.5"/></g><g><circle class="ink halo" cx="664.5" cy="86.7" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="664.5" cy="86.7" r="4.5"/></g><g><circle class="ink halo" cx="676.8" cy="76.2" r="6.5" filter="url(#glow)"/><circle class="ink ring" cx="676.8" cy="76.2" r="4.5"/></g>
<text class="muted" x="430" y="54">Source B amount</text><text x="575" y="388" text-anchor="middle">Source A amount</text>
<text class="strong" x="430" y="422">None within 5%</text><text class="muted" x="430" y="444">Sources kept separate</text>
