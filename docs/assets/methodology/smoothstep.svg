<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
<title id="title">Smoothstep compared with clamped linear scaling</title>
<desc id="desc">Smoothstep rises from zero at input zero to one at input one along an S-curve, flat at both ends and steepest in the middle. Outside zero to one it stays at zero or one. A dashed clamped linear ramp over the same interval has sharp corners at both ends.</desc>
