<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" role="img" aria-labelledby="title desc">
<title id="title">Smoothstep's rate of change starts and ends at zero, where clamped linear scaling jumps</title>
<desc id="desc">Two panels over one input axis. Above, smoothstep rises from zero at input zero to one at input one along an S-curve with flat ends, beside a dashed clamped linear ramp over the same interval. Below, the rate of change of each: the clamped linear rate jumps from zero to a constant at input zero and back to zero at input one, while the smoothstep rate rises from zero, peaks in the middle at 1.5 times the linear rate, and returns to zero without a jump.</desc>
