<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 433" role="img" aria-labelledby="title desc">
<title id="title">Comparison support contracts the score scale toward 50</title>
<desc id="desc">Full support preserves the combined score. Half support moves every value halfway toward 50. With no support all comparisons are neutral. An illustrative combined score of 75 becomes 75, 62.5, or 50 respectively.</desc>
<style>
text { font-family:"Avenir Next","Segoe UI",Arial,sans-serif; }
@media (prefers-color-scheme:dark) {
text { fill:#ffffff; }
[fill="#63706e"] { fill:#a6b2ae; } [stroke="#63706e"] { stroke:#a6b2ae; }
[fill="#b5bfbc"] { fill:#3c4846; } [stroke="#b5bfbc"] { stroke:#3c4846; }
[fill="#146cba"] { fill:#85bfff; } [stroke="#146cba"] { stroke:#85bfff; }
[fill="#a64d0c"] { fill:#ffbc7d; } [stroke="#a64d0c"] { stroke:#ffbc7d; }
}
</style>
