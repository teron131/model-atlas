<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-labelledby="title desc">
<title id="title">Quantile rank and percentile rank</title>
<desc id="desc">Total weight is laid out in sorted order: weight below value v, weight tied at v, and weight above v. The quantile rank counts the weight below v plus half the tied weight, ending in the middle of the tied block. The percentile rank counts the weight below v plus all of the tied weight, ending at the tied block's right edge.</desc>
<style>
text{font-family:"Avenir Next","Segoe UI",Arial,sans-serif;font-size:15px;fill:#202724}
.num{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,monospace;font-size:14px}
.small{font-size:12.5px}.big{font-size:18px}.strong{font-weight:600}
.muted{fill-opacity:.62}.faint{opacity:.4}.half{opacity:.5}
.grid{fill:none;stroke:#202724;stroke-opacity:.09}
.guide{fill:none;stroke:#202724;stroke-opacity:.22}
.axis{fill:none;stroke:#202724;stroke-opacity:.34}
.ink{fill:#202724}.ink-line{fill:none;stroke:#202724}.ink-wash{fill:#202724;fill-opacity:.08}
.ring{stroke:#f2f4f2;stroke-width:2;paint-order:stroke}.gap{stroke:#f2f4f2;stroke-width:2}
.violet{fill:#6b47e0}.violet-line{fill:none;stroke:#6b47e0}.violet-wash{fill:#6b47e0;fill-opacity:.14}
.rose{fill:#c93f78}.rose-line{fill:none;stroke:#c93f78}.rose-wash{fill:#c93f78;fill-opacity:.14}
.amber{fill:#a8740c}.amber-line{fill:none;stroke:#a8740c}.amber-wash{fill:#a8740c;fill-opacity:.16}
.h0{stop-color:#3557e6}.h1{stop-color:#6b47e0}.h2{stop-color:#d9467f}
.land0{stop-color:#6b47e0;stop-opacity:.12}.land1{stop-color:#6b47e0;stop-opacity:.01}
.halo{opacity:0}
.m{font-size:1.12em}.mr,.mi,.mb{font-family:"KaTeX_Main","Latin Modern Roman","STIX Two Text","Cambria","Times New Roman",serif;font-style:normal;font-weight:400}.mb{font-weight:700}.mi{font-family:"KaTeX_Math","Latin Modern Math","STIX Two Text","Cambria Math","Times New Roman",serif;font-style:italic}
@media (prefers-color-scheme:dark){
text{fill:#f2f3ed}.muted{fill-opacity:.58}
.grid{stroke:#f2f3ed;stroke-opacity:.08}.guide{stroke:#f2f3ed;stroke-opacity:.2}.axis{stroke:#f2f3ed;stroke-opacity:.3}
.ink{fill:#f2f3ed}.ink-line{stroke:#f2f3ed}.ink-wash{fill:#f2f3ed;fill-opacity:.1}
.ring{stroke:#0b1016}.gap{stroke:#0b1016}
.violet{fill:#8f6bff}.violet-line{stroke:#8f6bff}.violet-wash{fill:#8f6bff;fill-opacity:.22}
.rose{fill:#e06296}.rose-line{stroke:#e06296}.rose-wash{fill:#e06296;fill-opacity:.2}
.amber{fill:#b98b24}.amber-line{stroke:#b98b24}.amber-wash{fill:#b98b24;fill-opacity:.22}
.h0{stop-color:#4a72ff}.h1{stop-color:#8f6bff}.h2{stop-color:#ff92bd}
.land0{stop-color:#6f8cff;stop-opacity:.16}.land1{stop-color:#6f8cff;stop-opacity:.02}
.halo{opacity:.55}
}
</style>
<defs><filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter><marker id="tip-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="violet" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="rose" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="amber" d="M0 0L10 5L0 10Z"/></marker></defs>
<text class="muted" x="90" y="40">Total weight, sorted by value</text>
<rect class="ink-wash" x="91" y="96" width="268" height="40" rx="3"/><rect class="violet-wash" x="361" y="96" width="148" height="40" rx="3"/><rect class="ink-wash" x="511" y="96" width="178" height="40" rx="3"/>
<path class="guide" d="M435 102L435 130"/>
<text x="225" y="121" text-anchor="middle">Below <tspan class="m"><tspan class="mi">x</tspan></tspan></text><text x="435" y="84" text-anchor="middle">Tied at <tspan class="m"><tspan class="mi">x</tspan></tspan></text><g class="faint"><text x="600" y="121" text-anchor="middle">Above <tspan class="m"><tspan class="mi">x</tspan></tspan></text></g>
<text class="num muted" x="90" y="158" text-anchor="middle">0</text><text class="num muted" x="690" y="158" text-anchor="middle">100</text>
<path class="violet-line" d="M90 208L90 214" stroke-width="1.5"/><path class="violet-line" d="M90 214L435 214" stroke-width="1.5"/><path class="violet-line" d="M435 208L435 214" stroke-width="1.5"/><g><circle class="violet halo" cx="435" cy="214" r="7" filter="url(#glow)"/><circle class="violet ring" cx="435" cy="214" r="5"/></g><text x="90" y="200">weightedQuantileRank: half the tie</text>
<path class="ink-line" d="M90 264L90 270" stroke-width="1.5"/><path class="ink-line" d="M90 270L510 270" stroke-width="1.5"/><path class="ink-line" d="M510 264L510 270" stroke-width="1.5"/><g><circle class="ink halo" cx="510" cy="270" r="7" filter="url(#glow)"/><circle class="ink ring" cx="510" cy="270" r="5"/></g><text x="90" y="256">weightedPercentileRank: all of the tie</text>
</svg>
