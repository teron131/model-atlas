<text x="70" y="259" font-size="14" fill="#63706e" text-anchor="end" font-weight="400">110</text>
<path d="M80 174 H700" fill="none" stroke="#b5bfbc" stroke-width="1.5" stroke-dasharray="3 5"/>
<text x="70" y="179" font-size="14" fill="#63706e" text-anchor="end" font-weight="400">120</text>
<path d="M80 94 H700" fill="none" stroke="#b5bfbc" stroke-width="1.5" stroke-dasharray="3 5"/>
<text x="70" y="99" font-size="14" fill="#63706e" text-anchor="end" font-weight="400">130</text>
<text x="40" y="55" font-size="14" fill="#63706e" text-anchor="start" font-weight="400">Index</text>
<path d="M200 174 H510" fill="none" stroke="#146cba" stroke-width="1.5" stroke-dasharray="5 4"/>
