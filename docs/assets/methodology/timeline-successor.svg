<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
<title id="title">A dated successor cannot fall below an earlier estimate</title>
<desc id="desc">Three illustrative releases of one model at one reasoning effort have estimates one hundred twenty, one hundred sixteen and one hundred twenty-eight. The middle estimate is adjusted upward to one hundred twenty; the last remains one hundred twenty-eight. The plot shows the model assumption, not evidence that capability necessarily increased.</desc>
<style>
text { font-family:"Avenir Next","Segoe UI",Arial,sans-serif; }
@media (prefers-color-scheme:dark) {
text { fill:#ffffff; }
[fill="#63706e"] { fill:#a6b2ae; } [stroke="#63706e"] { stroke:#a6b2ae; }
[fill="#b5bfbc"] { fill:#3c4846; } [stroke="#b5bfbc"] { stroke:#3c4846; }
[fill="#146cba"] { fill:#85bfff; } [stroke="#146cba"] { stroke:#85bfff; }
[fill="#a64d0c"] { fill:#ffbc7d; } [stroke="#a64d0c"] { stroke:#ffbc7d; }
}
</style>
<circle cx="45" cy="24" r="5" fill="#63706e"/>
<text x="58" y="29" font-size="14" fill="#63706e" text-anchor="start" font-weight="400">Evidence-based estimate</text>
<circle cx="400" cy="24" r="5" fill="#146cba"/>
<text x="413" y="29" font-size="14" fill="#146cba" text-anchor="start" font-weight="400">After the successor assumption</text>
