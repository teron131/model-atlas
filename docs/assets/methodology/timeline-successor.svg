<circle cx="420" cy="174" r="6" fill="#146cba"/>
<circle cx="640" cy="110" r="6" fill="#146cba"/>
<text x="200" y="157" font-size="18" fill="#146cba" text-anchor="middle" font-weight="600">120</text>
<text x="438" y="165" font-size="18" fill="#146cba" text-anchor="start" font-weight="600">120</text>
<text x="438" y="222" font-size="17" fill="#63706e" text-anchor="start" font-weight="400">116</text>
<text x="640" y="85" font-size="18" fill="#146cba" text-anchor="middle" font-weight="600">128</text>
