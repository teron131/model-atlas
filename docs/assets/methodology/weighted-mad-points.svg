<g><circle class="ink halo" cx="356.7" cy="300" r="8" filter="url(#glow)"/><circle class="ink ring" cx="356.7" cy="300" r="6"/></g><g><circle class="ink halo" cx="396.7" cy="300" r="8" filter="url(#glow)"/><circle class="ink ring" cx="396.7" cy="300" r="6"/></g><g><circle class="ink halo" cx="396.7" cy="283" r="8" filter="url(#glow)"/><circle class="ink ring" cx="396.7" cy="283" r="6"/></g><g><circle class="violet halo" cx="450" cy="300" r="10.485281374238571" filter="url(#glow)"/><circle class="violet ring" cx="450" cy="300" r="8.485281374238571"/></g><g><circle class="ink halo" cx="490" cy="300" r="10.485281374238571" filter="url(#glow)"/><circle class="ink ring" cx="490" cy="300" r="8.485281374238571"/></g><g><circle class="ink halo" cx="570" cy="300" r="8" filter="url(#glow)"/><circle class="ink ring" cx="570" cy="300" r="6"/></g><g><circle class="ink halo" cx="636.7" cy="300" r="8" filter="url(#glow)"/><circle class="ink ring" cx="636.7" cy="300" r="6"/></g>
