<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">Each value moves to its distance from the median, and half the weight sets the MAD</title>
<desc id="desc">Illustrative weighted values on a line, with point area showing weight. Values below the median flip over it to the same distance on the other side, shown as dashed outlines. Every value then drops straight onto an axis of distance from the median, which starts directly under the median; a value that flips onto the same distance as one above the median lands with it and stacks. Below, each landed value's weight is laid end to end in order of distance. The 50 percent point of that strip falls inside one value's weight, and that value's distance is the MAD.</desc>
<style>
text{font-family:"Avenir Next","Segoe UI",Arial,sans-serif;font-size:15px;fill:#202724}
.num{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,monospace;font-size:14px}
.small{font-size:12.5px}.big{font-size:18px}.strong{font-weight:600}
.muted{fill-opacity:.62}.faint{opacity:.4}.half{opacity:.5}
.grid{fill:none;stroke:#202724;stroke-opacity:.09}
.guide{fill:none;stroke:#202724;stroke-opacity:.22}
.axis{fill:none;stroke:#202724;stroke-opacity:.34}
.ink{fill:#202724}.ink-line{fill:none;stroke:#202724}.ink-wash{fill:#202724;fill-opacity:.08}
.ring{stroke:#f2f4f2;stroke-width:2;paint-order:stroke}.gap{stroke:#f2f4f2;stroke-width:2}
.violet{fill:#6b47e0}.violet-line{fill:none;stroke:#6b47e0}.violet-wash{fill:#6b47e0;fill-opacity:.14}
.rose{fill:#c93f78}.rose-line{fill:none;stroke:#c93f78}.rose-wash{fill:#c93f78;fill-opacity:.14}
.amber{fill:#a8740c}.amber-line{fill:none;stroke:#a8740c}.amber-wash{fill:#a8740c;fill-opacity:.16}
.h0{stop-color:#3557e6}.h1{stop-color:#6b47e0}.h2{stop-color:#d9467f}
.land0{stop-color:#6b47e0;stop-opacity:.12}.land1{stop-color:#6b47e0;stop-opacity:.01}
.halo{opacity:0}
.m{font-size:1.12em}.mr,.mi,.mb{font-family:"KaTeX_Main","Latin Modern Roman","STIX Two Text","Cambria","Times New Roman",serif;font-style:normal;font-weight:400}.mb{font-weight:700}.mi{font-family:"KaTeX_Math","Latin Modern Math","STIX Two Text","Cambria Math","Times New Roman",serif;font-style:italic}
@media (prefers-color-scheme:dark){
text{fill:#f2f3ed}.muted{fill-opacity:.58}
.grid{stroke:#f2f3ed;stroke-opacity:.08}.guide{stroke:#f2f3ed;stroke-opacity:.2}.axis{stroke:#f2f3ed;stroke-opacity:.3}
.ink{fill:#f2f3ed}.ink-line{stroke:#f2f3ed}.ink-wash{fill:#f2f3ed;fill-opacity:.1}
.ring{stroke:#0b1016}.gap{stroke:#0b1016}
.violet{fill:#8f6bff}.violet-line{stroke:#8f6bff}.violet-wash{fill:#8f6bff;fill-opacity:.22}
.rose{fill:#e06296}.rose-line{stroke:#e06296}.rose-wash{fill:#e06296;fill-opacity:.2}
.amber{fill:#b98b24}.amber-line{stroke:#b98b24}.amber-wash{fill:#b98b24;fill-opacity:.22}
.h0{stop-color:#4a72ff}.h1{stop-color:#8f6bff}.h2{stop-color:#ff92bd}
.land0{stop-color:#6f8cff;stop-opacity:.16}.land1{stop-color:#6f8cff;stop-opacity:.02}
.halo{opacity:.55}
}
</style>
<defs><filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter><marker id="tip-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="violet" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="rose" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="amber" d="M0 0L10 5L0 10Z"/></marker></defs>
<text class="muted" x="90" y="40">Log token count <tspan class="m"><tspan class="mi">x</tspan></tspan></text><text class="small muted" x="690" y="40" text-anchor="end">Point area = reference weight</text>
<path class="ink-line" d="M570 176L570 300" stroke-width="1.5" stroke-dasharray="0.5 4" stroke-linecap="round" stroke-opacity=".55"/><path class="ink-line" d="M450 176L450 300" stroke-width="1.5" stroke-dasharray="0.5 4" stroke-linecap="round" stroke-opacity=".55"/><path class="ink-line" d="M396.7 176L396.7 283" stroke-width="1.5" stroke-dasharray="0.5 4" stroke-linecap="round" stroke-opacity=".55"/><path class="ink-line" d="M490 176L490 300" stroke-width="1.5" stroke-dasharray="0.5 4" stroke-linecap="round" stroke-opacity=".55"/><path class="ink-line" d="M636.7 176L636.7 300" stroke-width="1.5" stroke-dasharray="0.5 4" stroke-linecap="round" stroke-opacity=".55"/>
<path class="axis" d="M90 176L690 176"/>
<path class="violet-line" d="M356.7 154L356.7 182" stroke-width="2"/><text x="356.7" y="202" text-anchor="middle">Median</text>
<path class="guide" d="M356.7 182L356.7 188.2M356.7 207.3L356.7 270.9M356.7 289.1L356.7 300" stroke-dasharray="4 4"/>
<path class="ink-line" d="M143.3 176Q356.7 -66.8 570 164" stroke-width="1.5" stroke-dasharray="0.5 4" stroke-linecap="round" stroke-opacity=".7" marker-end="url(#tip-ink)"/><circle class="ink-line" cx="570" cy="176" r="6" stroke-width="1.25" stroke-dasharray="4 4" stroke-opacity=".7"/><path class="ink-line" d="M263.3 176Q356.7 45.9 450 161.5" stroke-width="1.5" stroke-dasharray="0.5 4" stroke-linecap="round" stroke-opacity=".7" marker-end="url(#tip-ink)"/><circle class="ink-line" cx="450" cy="176" r="8.5" stroke-width="1.25" stroke-dasharray="4 4" stroke-opacity=".7"/><path class="ink-line" d="M316.7 176Q356.7 99.6 396.7 164" stroke-width="1.5" stroke-dasharray="0.5 4" stroke-linecap="round" stroke-opacity=".7" marker-end="url(#tip-ink)"/><circle class="ink-line" cx="396.7" cy="176" r="6" stroke-width="1.25" stroke-dasharray="4 4" stroke-opacity=".7"/>
<g><circle class="ink halo" cx="143.3" cy="176" r="8" filter="url(#glow)"/><circle class="ink ring" cx="143.3" cy="176" r="6"/></g><g><circle class="ink halo" cx="263.3" cy="176" r="10.485281374238571" filter="url(#glow)"/><circle class="ink ring" cx="263.3" cy="176" r="8.485281374238571"/></g><g><circle class="ink halo" cx="316.7" cy="176" r="8" filter="url(#glow)"/><circle class="ink ring" cx="316.7" cy="176" r="6"/></g><g><circle class="ink halo" cx="356.7" cy="176" r="8" filter="url(#glow)"/><circle class="ink ring" cx="356.7" cy="176" r="6"/></g><g><circle class="ink halo" cx="396.7" cy="176" r="8" filter="url(#glow)"/><circle class="ink ring" cx="396.7" cy="176" r="6"/></g><g><circle class="ink halo" cx="490" cy="176" r="10.485281374238571" filter="url(#glow)"/><circle class="ink ring" cx="490" cy="176" r="8.485281374238571"/></g><g><circle class="ink halo" cx="636.7" cy="176" r="8" filter="url(#glow)"/><circle class="ink ring" cx="636.7" cy="176" r="6"/></g>
<path class="axis" d="M356.7 300L690 300"/><text class="num muted" x="356.7" y="284" text-anchor="middle">0</text><text class="muted" x="334.7" y="305" text-anchor="end">Distance from the median <tspan class="m"><tspan class="mr">|</tspan><tspan class="mi">x</tspan><tspan class="mr"> − </tspan><tspan class="mr">median</tspan><tspan class="mr">|</tspan></tspan></text>
