<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">Final Speed and Value assembly</title>
  <desc id="desc">Component scores and their evidence weights form an evidence-weighted mean and individual confidence. Model-default evidence separately forms a coverage multiplier. The weighted mean times model coverage becomes the public Speed or Value score.</desc>
  <style>
    :root { --bg: #000000; --fg: #f5f5f5; --muted: #d4d4d4; --grid: #3f3f46; --primary: #60a5fa; --secondary: #fbbf24; --tertiary: #c4b5fd; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: var(--fg); }
    .muted { fill: var(--muted); font-size: 14px; }
    .label { font-size: 17px; }
    .annotation { font-size: 15px; font-weight: 600; }
    .micro { fill: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
    .rule { stroke: var(--grid); stroke-width: 1; }
    .primary { fill: none; stroke: var(--primary); stroke-width: 2; stroke-linecap: round; }
    .secondary { fill: none; stroke: var(--secondary); stroke-width: 2; stroke-linecap: round; }
    .tertiary { fill: none; stroke: var(--tertiary); stroke-width: 2; stroke-linecap: round; }
    .operator { font-size: 17px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="var(--primary)" />
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="var(--secondary)" />
    </marker>
    <marker id="arrow-secondary-branch" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="var(--secondary)" />
    </marker>
    <marker id="arrow-tertiary" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="var(--tertiary)" />
    </marker>
  </defs>

  <rect width="720" height="500" fill="var(--bg)" />
  <text x="360" y="31" text-anchor="middle" class="label">Final Speed and Value assembly</text>

  <text x="90" y="72" class="micro">EFFORT EVIDENCE</text>
  <text x="300" y="72" class="micro">EFFORT OUTPUTS</text>
  <text x="560" y="72" class="micro">PUBLIC OUTPUTS</text>
  <line x1="90" y1="84" x2="670" y2="84" class="rule" />

  <text x="90" y="120" class="annotation">component scores</text>
  <text x="90" y="143" class="muted">s<tspan baseline-shift="sub" font-size="10">m,i</tspan><tspan baseline-shift="super" font-size="10">p</tspan></text>
  <text x="90" y="200" class="annotation">evidence weights</text>
  <text x="90" y="223" class="muted">η<tspan baseline-shift="sub" font-size="10">m,i</tspan><tspan baseline-shift="super" font-size="10">p</tspan></text>

  <path d="M238 128 L286 128" class="primary" marker-end="url(#arrow-primary)" />
  <path d="M238 208 C262 208 266 158 286 148" class="secondary" marker-end="url(#arrow-secondary-branch)" />
  <path d="M238 208 C262 208 266 240 286 250" class="secondary" marker-end="url(#arrow-secondary-branch)" />

  <text x="300" y="120" class="annotation">evidence-weighted mean</text>
  <text x="300" y="143" class="muted">Σηs / Ση</text>
  <text x="300" y="242" class="annotation">individual confidence</text>
  <text x="300" y="265" class="muted">Ση / K<tspan baseline-shift="sub" font-size="10">p</tspan></text>

  <path d="M482 128 L516 128" class="primary" />
  <path d="M540 128 L548 128" class="primary" marker-end="url(#arrow-primary)" />
  <path d="M482 250 L548 250" class="secondary" marker-end="url(#arrow-secondary)" />

  <text x="560" y="120" class="annotation">Speed or Value</text>
  <text x="560" y="143" class="muted">C<tspan baseline-shift="sub" font-size="10">q</tspan><tspan baseline-shift="super" font-size="10">p</tspan> × Σηs / Ση</text>
  <text x="560" y="242" class="annotation">confidence</text>
  <text x="560" y="265" class="muted">Ση / K<tspan baseline-shift="sub" font-size="10">p</tspan></text>

  <line x1="90" y1="305" x2="670" y2="305" class="rule" />
  <text x="90" y="340" class="micro">MODEL-DEFAULT EVIDENCE</text>

  <text x="90" y="386" class="annotation">default weights</text>
  <text x="90" y="409" class="muted">η<tspan baseline-shift="sub" font-size="10">m_q default,i</tspan><tspan baseline-shift="super" font-size="10">p</tspan></text>

  <path d="M238 394 L286 394" class="tertiary" marker-end="url(#arrow-tertiary)" />
  <text x="300" y="386" class="annotation">model coverage</text>
  <text x="300" y="409" class="muted">C<tspan baseline-shift="sub" font-size="10">q</tspan><tspan baseline-shift="super" font-size="10">p</tspan> = smoothstep(γ<tspan baseline-shift="sub" font-size="10">q</tspan><tspan baseline-shift="super" font-size="10">p</tspan>)</text>

  <path d="M482 394 C525 394 495 158 520 140" class="tertiary" />
  <text x="528" y="134" text-anchor="middle" class="operator">×</text>

  <text x="90" y="456" class="muted">p = speed or value</text>
  <text x="670" y="456" text-anchor="end" class="muted">coverage is shared by model · confidence is specific to effort</text>
</svg>
