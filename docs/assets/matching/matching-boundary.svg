<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">Accepted matches add compatible metadata while preserving source evidence</title>
<desc id="desc">The Models.dev catalog entry carries an identity and metadata such as prices, context window, and release date; the benchmark data carries an identity, an explicit variant, its observations, and its own reported prices and release date. After identity and configuration checks, an accepted match takes the Models.dev identity and metadata while keeping the benchmark variant and observations. Without an accepted match, the qualified benchmark identity survives with its observations and its own reported prices and release date, and the context window stays unknown.</desc>
<style>
text{font-family:"Avenir Next","Segoe UI",Arial,sans-serif;font-size:15px;fill:#202724}
.num{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,monospace;font-size:14px}
.small{font-size:12.5px}.big{font-size:18px}.strong{font-weight:600}
.muted{fill-opacity:.62}.faint{opacity:.4}.half{opacity:.5}
.grid{fill:none;stroke:#202724;stroke-opacity:.09}
.guide{fill:none;stroke:#202724;stroke-opacity:.22}
.axis{fill:none;stroke:#202724;stroke-opacity:.34}
.ink{fill:#202724}.ink-line{fill:none;stroke:#202724}.ink-wash{fill:#202724;fill-opacity:.08}
.ring{stroke:#f2f4f2;stroke-width:2;paint-order:stroke}.gap{stroke:#f2f4f2;stroke-width:2}
.violet{fill:#6b47e0}.violet-line{fill:none;stroke:#6b47e0}.violet-wash{fill:#6b47e0;fill-opacity:.14}
.rose{fill:#c93f78}.rose-line{fill:none;stroke:#c93f78}.rose-wash{fill:#c93f78;fill-opacity:.14}
.amber{fill:#a8740c}.amber-line{fill:none;stroke:#a8740c}.amber-wash{fill:#a8740c;fill-opacity:.16}
.h0{stop-color:#3557e6}.h1{stop-color:#6b47e0}.h2{stop-color:#d9467f}
.land0{stop-color:#6b47e0;stop-opacity:.12}.land1{stop-color:#6b47e0;stop-opacity:.01}
.halo{opacity:0}
.m{font-size:1.12em}.mr,.mi,.mb{font-family:"KaTeX_Main","Latin Modern Roman","STIX Two Text","Cambria","Times New Roman",serif;font-style:normal;font-weight:400}.mb{font-weight:700}.mi{font-family:"KaTeX_Math","Latin Modern Math","STIX Two Text","Cambria Math","Times New Roman",serif;font-style:italic}
@media (prefers-color-scheme:dark){
text{fill:#f2f3ed}.muted{fill-opacity:.58}
.grid{stroke:#f2f3ed;stroke-opacity:.08}.guide{stroke:#f2f3ed;stroke-opacity:.2}.axis{stroke:#f2f3ed;stroke-opacity:.3}
.ink{fill:#f2f3ed}.ink-line{stroke:#f2f3ed}.ink-wash{fill:#f2f3ed;fill-opacity:.1}
.ring{stroke:#0b1016}.gap{stroke:#0b1016}
.violet{fill:#8f6bff}.violet-line{stroke:#8f6bff}.violet-wash{fill:#8f6bff;fill-opacity:.22}
.rose{fill:#e06296}.rose-line{stroke:#e06296}.rose-wash{fill:#e06296;fill-opacity:.2}
.amber{fill:#b98b24}.amber-line{stroke:#b98b24}.amber-wash{fill:#b98b24;fill-opacity:.22}
.h0{stop-color:#4a72ff}.h1{stop-color:#8f6bff}.h2{stop-color:#ff92bd}
.land0{stop-color:#6f8cff;stop-opacity:.16}.land1{stop-color:#6f8cff;stop-opacity:.02}
.halo{opacity:.55}
}
</style>
<defs><filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter><marker id="tip-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="violet" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="rose" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="amber" d="M0 0L10 5L0 10Z"/></marker></defs>
<text class="small muted" x="317" y="40" text-anchor="middle">Inputs</text><text class="small muted" x="615" y="40" text-anchor="middle">After identity and configuration checks</text>
<path class="guide" d="M465 26L465 290"/>
<text class="strong" x="245" y="76" text-anchor="middle">Models.dev catalog</text><text class="strong" x="390" y="76" text-anchor="middle">Benchmark data</text><text class="strong" x="545" y="76" text-anchor="middle">Accepted match</text><text class="strong" x="685" y="76" text-anchor="middle">No accepted match</text>
<text class="muted" x="40" y="109">Identity</text><path class="grid" d="M160 104L740 104"/><rect class="violet" x="223" y="101.5" width="44" height="5" rx="2.5" opacity=".85"/><rect class="ink" x="368" y="101.5" width="44" height="5" rx="2.5" opacity=".85"/><rect class="violet" x="523" y="101.5" width="44" height="5" rx="2.5" opacity=".85"/><rect class="ink" x="663" y="101.5" width="44" height="5" rx="2.5" opacity=".85"/>
<text class="muted" x="40" y="143">Variant</text><path class="grid" d="M160 138L740 138"/><path class="axis" d="M239 138L251 138" stroke-width="1.5"/><rect class="ink" x="368" y="135.5" width="44" height="5" rx="2.5" opacity=".85"/><rect class="ink" x="523" y="135.5" width="44" height="5" rx="2.5" opacity=".85"/><rect class="ink" x="663" y="135.5" width="44" height="5" rx="2.5" opacity=".85"/>
<text class="muted" x="40" y="177">Observations</text><path class="grid" d="M160 172L740 172"/><path class="axis" d="M239 172L251 172" stroke-width="1.5"/><g><circle class="ink halo" cx="378" cy="172" r="5.5" filter="url(#glow)"/><circle class="ink ring" cx="378" cy="172" r="3.5"/></g><g><circle class="ink halo" cx="390" cy="172" r="5.5" filter="url(#glow)"/><circle class="ink ring" cx="390" cy="172" r="3.5"/></g><g><circle class="ink halo" cx="402" cy="172" r="5.5" filter="url(#glow)"/><circle class="ink ring" cx="402" cy="172" r="3.5"/></g><g><circle class="ink halo" cx="533" cy="172" r="5.5" filter="url(#glow)"/><circle class="ink ring" cx="533" cy="172" r="3.5"/></g><g><circle class="ink halo" cx="545" cy="172" r="5.5" filter="url(#glow)"/><circle class="ink ring" cx="545" cy="172" r="3.5"/></g><g><circle class="ink halo" cx="557" cy="172" r="5.5" filter="url(#glow)"/><circle class="ink ring" cx="557" cy="172" r="3.5"/></g><g><circle class="ink halo" cx="673" cy="172" r="5.5" filter="url(#glow)"/><circle class="ink ring" cx="673" cy="172" r="3.5"/></g><g><circle class="ink halo" cx="685" cy="172" r="5.5" filter="url(#glow)"/><circle class="ink ring" cx="685" cy="172" r="3.5"/></g><g><circle class="ink halo" cx="697" cy="172" r="5.5" filter="url(#glow)"/><circle class="ink ring" cx="697" cy="172" r="3.5"/></g>
<text class="muted" x="40" y="211">Prices</text><path class="grid" d="M160 206L740 206"/><rect class="violet" x="223" y="203.5" width="44" height="5" rx="2.5" opacity=".85"/><rect class="ink" x="368" y="203.5" width="44" height="5" rx="2.5" opacity=".85"/><rect class="violet" x="523" y="203.5" width="44" height="5" rx="2.5" opacity=".85"/><rect class="ink" x="663" y="203.5" width="44" height="5" rx="2.5" opacity=".85"/>
<text class="muted" x="40" y="245">Context window</text><path class="grid" d="M160 240L740 240"/><rect class="violet" x="223" y="237.5" width="44" height="5" rx="2.5" opacity=".85"/><path class="axis" d="M384 240L396 240" stroke-width="1.5"/><rect class="violet" x="523" y="237.5" width="44" height="5" rx="2.5" opacity=".85"/><path class="axis" d="M679 240L691 240" stroke-width="1.5"/>
<text class="muted" x="40" y="279">Release date</text><path class="grid" d="M160 274L740 274"/><rect class="violet" x="223" y="271.5" width="44" height="5" rx="2.5" opacity=".85"/><rect class="ink" x="368" y="271.5" width="44" height="5" rx="2.5" opacity=".85"/><rect class="violet" x="523" y="271.5" width="44" height="5" rx="2.5" opacity=".85"/><rect class="ink" x="663" y="271.5" width="44" height="5" rx="2.5" opacity=".85"/>
<rect class="violet" x="40" y="315.5" width="28" height="5" rx="2.5" opacity=".85"/><text class="muted" x="78" y="322">From the Models.dev catalog</text><rect class="ink" x="320" y="315.5" width="28" height="5" rx="2.5" opacity=".85"/><text class="muted" x="358" y="322">From the benchmark data</text>
</svg>
