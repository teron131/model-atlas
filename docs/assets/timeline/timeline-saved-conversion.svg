<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">Where the saved conversion coefficients come from</title>
<desc id="desc">Two illustrative conversion lines with benchmark B results on the horizontal axes. The B-to-A line has slope one half and crosses the A-result axis at 10, so an increase of 20 in B adds 10 in A. Combined with the saved A-to-reference conversion q equals 2 times A plus 10, the saved B-to-reference line has slope 1 and crosses its axis at 30. A B result of 80 gives an A result of 50 and a reference position of 110; another model's B result of 90 reaches 120.</desc>
<style>
text{font-family:"Avenir Next","Segoe UI",Arial,sans-serif;font-size:15px;fill:#202724}
.num{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,monospace;font-size:14px}
.small{font-size:12.5px}.big{font-size:18px}.strong{font-weight:600}
.muted{fill-opacity:.62}.faint{opacity:.4}.half{opacity:.5}
.grid{fill:none;stroke:#202724;stroke-opacity:.09}
.guide{fill:none;stroke:#202724;stroke-opacity:.22}
.axis{fill:none;stroke:#202724;stroke-opacity:.34}
.ink{fill:#202724}.ink-line{fill:none;stroke:#202724}.ink-wash{fill:#202724;fill-opacity:.08}
.ring{stroke:#f2f4f2;stroke-width:2;paint-order:stroke}.gap{stroke:#f2f4f2;stroke-width:2}
.violet{fill:#6b47e0}.violet-line{fill:none;stroke:#6b47e0}.violet-wash{fill:#6b47e0;fill-opacity:.14}
.rose{fill:#c93f78}.rose-line{fill:none;stroke:#c93f78}.rose-wash{fill:#c93f78;fill-opacity:.14}
.amber{fill:#a8740c}.amber-line{fill:none;stroke:#a8740c}.amber-wash{fill:#a8740c;fill-opacity:.16}
.h0{stop-color:#3557e6}.h1{stop-color:#6b47e0}.h2{stop-color:#d9467f}
.land0{stop-color:#6b47e0;stop-opacity:.12}.land1{stop-color:#6b47e0;stop-opacity:.01}
.halo{opacity:0}
.m{font-size:1.12em}.mr,.mi,.mb{font-family:"KaTeX_Main","Latin Modern Roman","STIX Two Text","Cambria","Times New Roman",serif;font-style:normal;font-weight:400}.mb{font-weight:700}.mi{font-family:"KaTeX_Math","Latin Modern Math","STIX Two Text","Cambria Math","Times New Roman",serif;font-style:italic}
@media (prefers-color-scheme:dark){
text{fill:#f2f3ed}.muted{fill-opacity:.58}
.grid{stroke:#f2f3ed;stroke-opacity:.08}.guide{stroke:#f2f3ed;stroke-opacity:.2}.axis{stroke:#f2f3ed;stroke-opacity:.3}
.ink{fill:#f2f3ed}.ink-line{stroke:#f2f3ed}.ink-wash{fill:#f2f3ed;fill-opacity:.1}
.ring{stroke:#0b1016}.gap{stroke:#0b1016}
.violet{fill:#8f6bff}.violet-line{stroke:#8f6bff}.violet-wash{fill:#8f6bff;fill-opacity:.22}
.rose{fill:#e06296}.rose-line{stroke:#e06296}.rose-wash{fill:#e06296;fill-opacity:.2}
.amber{fill:#b98b24}.amber-line{stroke:#b98b24}.amber-wash{fill:#b98b24;fill-opacity:.22}
.h0{stop-color:#4a72ff}.h1{stop-color:#8f6bff}.h2{stop-color:#ff92bd}
.land0{stop-color:#6f8cff;stop-opacity:.16}.land1{stop-color:#6f8cff;stop-opacity:.02}
.halo{opacity:.55}
}
</style>
<defs><filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter><marker id="tip-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="violet" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="rose" d="M0 0L10 5L0 10Z"/></marker><marker id="tip-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="amber" d="M0 0L10 5L0 10Z"/></marker><linearGradient id="light" gradientUnits="userSpaceOnUse" x1="460" y1="0" x2="700" y2="0"><stop class="h0" offset="0"/><stop class="h1" offset=".58"/><stop class="h2" offset="1"/></linearGradient><linearGradient id="land" gradientUnits="userSpaceOnUse" x1="0" y1="126" x2="0" y2="330"><stop class="land0" offset="0"/><stop class="land1" offset="1"/></linearGradient></defs>
<text class="num big" x="90" y="58"><tspan class="m"><tspan class="mi">x</tspan><tspan dy="5" font-size="0.72em"><tspan class="mi">A</tspan></tspan><tspan dy="-5">​</tspan><tspan class="mr"> = 0.5 </tspan><tspan class="mi">x</tspan><tspan dy="5" font-size="0.72em"><tspan class="mi">B</tspan></tspan><tspan dy="-5">​</tspan><tspan class="mr"> + 10</tspan></tspan></text>
<path class="axis" d="M90 330L330 330"/><text class="num muted" x="80" y="334.5" text-anchor="end">0</text><path class="grid" d="M90 271.7L330 271.7"/><text class="num muted" x="80" y="276.2" text-anchor="end">20</text><path class="grid" d="M90 213.4L330 213.4"/><text class="num muted" x="80" y="217.9" text-anchor="end">40</text><path class="grid" d="M90 155.1L330 155.1"/><text class="num muted" x="80" y="159.6" text-anchor="end">60</text><path class="axis" d="M90 330L90 336"/><text class="num muted" x="90" y="352" text-anchor="middle">0</text><path class="axis" d="M138 330L138 336"/><text class="num muted" x="138" y="352" text-anchor="middle">20</text><path class="axis" d="M186 330L186 336"/><text class="num muted" x="186" y="352" text-anchor="middle">40</text><path class="axis" d="M234 330L234 336"/><text class="num muted" x="234" y="352" text-anchor="middle">60</text><path class="axis" d="M282 330L282 336"/><text class="num muted" x="282" y="352" text-anchor="middle">80</text><path class="axis" d="M330 330L330 336"/><text class="num muted" x="330" y="352" text-anchor="middle">100</text>
<path class="guide" d="M282 184.3L282 330"/><path class="guide" d="M90 184.3L282 184.3"/>
<path class="ink-line" d="M90 300.9L330 155.1" stroke-width="2"/><path class="ink-line" d="M138 271.7H186V242.6" stroke-width="1.5"/><text class="num" x="162" y="289.7" text-anchor="middle">+20</text><text class="num" x="194" y="262.1">+10</text>
<g><circle class="ink halo" cx="90" cy="300.9" r="7" filter="url(#glow)"/><circle class="ink ring" cx="90" cy="300.9" r="5"/></g><text class="num strong" x="102" y="318.9">10</text>
<g><circle class="ink halo" cx="282" cy="184.3" r="7.5" filter="url(#glow)"/><circle class="ink ring" cx="282" cy="184.3" r="5.5"/></g><text class="num strong" x="272" y="174.3" text-anchor="end">50</text>
<text class="muted" x="330" y="376" text-anchor="end">Benchmark B result <tspan class="m"><tspan class="mi">x</tspan><tspan dy="5" font-size="0.72em"><tspan class="mi">B</tspan></tspan><tspan dy="-5">​</tspan></tspan></text><text class="muted" x="90" y="108">Benchmark A result <tspan class="m"><tspan class="mi">x</tspan><tspan dy="5" font-size="0.72em"><tspan class="mi">A</tspan></tspan><tspan dy="-5">​</tspan></tspan></text>
<text class="num big" x="460" y="58"><tspan class="m"><tspan class="mi">q</tspan><tspan class="mr"> = </tspan><tspan class="mi">x</tspan><tspan dy="5" font-size="0.72em"><tspan class="mi">B</tspan></tspan><tspan dy="-5">​</tspan><tspan class="mr"> + 30</tspan></tspan></text><text class="num small muted" x="460" y="80">Given: <tspan class="m"><tspan class="mi">q</tspan><tspan class="mr"> = 2 </tspan><tspan class="mi">x</tspan><tspan dy="5" font-size="0.72em"><tspan class="mi">A</tspan></tspan><tspan dy="-5">​</tspan><tspan class="mr"> + 10</tspan></tspan></text>
<path class="axis" d="M460 330L700 330"/><text class="num muted" x="450" y="334.5" text-anchor="end">0</text><path class="grid" d="M460 262L700 262"/><text class="num muted" x="450" y="266.5" text-anchor="end">50</text><path class="grid" d="M460 194L700 194"/><text class="num muted" x="450" y="198.5" text-anchor="end">100</text><path class="grid" d="M460 126L700 126"/><text class="num muted" x="450" y="130.5" text-anchor="end">150</text><path class="axis" d="M460 330L460 336"/><text class="num muted" x="460" y="352" text-anchor="middle">0</text><path class="axis" d="M508 330L508 336"/><text class="num muted" x="508" y="352" text-anchor="middle">20</text><path class="axis" d="M556 330L556 336"/><text class="num muted" x="556" y="352" text-anchor="middle">40</text><path class="axis" d="M604 330L604 336"/><text class="num muted" x="604" y="352" text-anchor="middle">60</text><path class="axis" d="M652 330L652 336"/><text class="num muted" x="652" y="352" text-anchor="middle">80</text><path class="axis" d="M700 330L700 336"/><text class="num muted" x="700" y="352" text-anchor="middle">100</text>
<path class="guide" d="M652 180.4L652 330"/><path class="guide" d="M460 180.4L652 180.4"/>
<path d="M460 289.2L700 153.2" fill="none" stroke="url(#light)" stroke-width="8" opacity=".14" class="halo"/><path d="M460 289.2L700 153.2" fill="none" stroke="url(#light)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path class="violet-line" d="M508 262H556V234.8" stroke-width="1.5"/><text class="num" x="532" y="280" text-anchor="middle">+20</text><text class="num" x="564" y="253.4">+20</text><path class="guide" d="M676 166.8L676 330"/><g class="half"><circle class="ink halo" cx="676" cy="166.8" r="7" filter="url(#glow)"/><circle class="ink ring" cx="676" cy="166.8" r="5"/></g><text class="num muted" x="686" y="184.8">120</text>
<g><circle class="violet halo" cx="460" cy="289.2" r="7" filter="url(#glow)"/><circle class="violet ring" cx="460" cy="289.2" r="5"/></g><text class="num strong" x="472" y="307.2">30</text>
<g><circle class="ink halo" cx="652" cy="180.4" r="7.5" filter="url(#glow)"/><circle class="ink ring" cx="652" cy="180.4" r="5.5"/></g><text class="num strong" x="642" y="170.4" text-anchor="end">110</text>
<text class="muted" x="700" y="376" text-anchor="end">Benchmark B result <tspan class="m"><tspan class="mi">x</tspan><tspan dy="5" font-size="0.72em"><tspan class="mi">B</tspan></tspan><tspan dy="-5">​</tspan></tspan></text><text class="muted" x="460" y="108">Reference position <tspan class="m"><tspan class="mi">q</tspan></tspan></text>
</svg>
