<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="title desc">
<title id="title">Where the saved conversion coefficients come from</title>
<desc id="desc">Two illustrative conversion lines show benchmark B results on the horizontal axes. The first line has slope one half and crosses the A-result axis at ten. The saved reference conversion has slope one and crosses its vertical axis at thirty. Both y-intercepts are marked on their axes. Rise/run triangles on the lines show that an input increase of twenty gives an output increase of ten on the left and twenty on the right, indicating slopes of one half and one.</desc>
<style>
text { font-family:"Avenir Next","Segoe UI",Arial,sans-serif; }
@media (prefers-color-scheme:dark) {
text { fill:#ffffff; }
[fill="#63706e"] { fill:#a6b2ae; } [stroke="#63706e"] { stroke:#a6b2ae; }
[fill="#b5bfbc"] { fill:#3c4846; } [stroke="#b5bfbc"] { stroke:#3c4846; }
[fill="#146cba"] { fill:#85bfff; } [stroke="#146cba"] { stroke:#85bfff; }
[fill="#a64d0c"] { fill:#ffbc7d; } [stroke="#a64d0c"] { stroke:#ffbc7d; }
}
</style>
<text x="72" y="30" font-size="19" fill="#a64d0c" text-anchor="start" font-weight="600">Connect B to A</text>
<text x="72" y="56" font-size="16" fill="#a64d0c" text-anchor="start" font-weight="400">x<tspan baseline-shift="sub" font-size="11">A</tspan> = 0.5x<tspan baseline-shift="sub" font-size="11">B</tspan> + 10</text>
<text x="450" y="30" font-size="19" fill="#146cba" text-anchor="start" font-weight="600">B to the reference</text>
<text x="450" y="56" font-size="16" fill="#146cba" text-anchor="start" font-weight="400">q = x<tspan baseline-shift="sub" font-size="11">B</tspan> + 30</text>
<text x="450" y="82" font-size="14" fill="#63706e" text-anchor="start" font-weight="400">Given: q = 2x<tspan baseline-shift="sub" font-size="11">A</tspan> + 10</text>
<g transform="translate(0 -40)">
<text x="72" y="163" font-size="14" fill="#63706e" text-anchor="start" font-weight="400">Benchmark A result, x<tspan baseline-shift="sub" font-size="11">A</tspan></text>
