<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
<title id="title">The same z-score on distributions with different spreads</title>
<desc id="desc">Two illustrative rulers in the same reported units. Benchmark A, above, has mean 40 and standard deviation 10; benchmark B, below, has mean 60 and standard deviation 20. Lines join results with the same z-score from minus 2 to plus 2, so each standard deviation on A spans twice as much on B. The highlighted line joins 50 on A and 80 on B, both one standard deviation above their mean. Bell shapes illustrate the example and are not an assumption of the linking method.</desc>
