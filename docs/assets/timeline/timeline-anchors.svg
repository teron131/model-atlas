<title id="title">How anchors affect readability</title>
<desc id="desc">Selected retained Intelligence scores compare saved anchors of one hundred and one hundred fifty with illustrative anchors of twenty and eighty. Four highlighted model pairs have unequal upward arrows: GPT-4, Claude Opus 4.5, GPT-6 Astra and Gemma 7B. Other scores are faded. The sixty-point anchor gap becomes fifty points, so all score gaps shrink by the same proportion. Release dates, model order and underlying evidence remain unchanged.</desc>
