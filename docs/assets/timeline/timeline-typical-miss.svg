<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" role="img" aria-labelledby="title desc">
<title id="title">A result's miss is smallest at the mean of the checked values and widens with distance from it</title>
<desc id="desc">A curve of one result's miss against its converted result on the reference scale. Ten illustrative checked values sit along the axis around their mean, q bar b, with ticks at one and two standard deviations sigma b on either side. The miss is smallest at the mean, where it equals the benchmark's typical miss e b, and widens on both sides with distance from the mean. A result q m b beyond two standard deviations reads a larger miss e m b on the curve.</desc>
<style>
