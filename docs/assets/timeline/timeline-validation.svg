<title id="title">Leave one model family out, then predict its result</title>
<desc id="desc">Left: five training families determine a benchmark conversion. The withheld family has benchmark A result 65, predicting B result 75; its observed B result is 80. The error is 5 over a training B range of 50, or 10 normalized points. Right: six validation rounds each leave out a different family, including all its reasoning configurations.</desc>
